    function buildStationYMap(){
      const rows = lineWrap.querySelectorAll(".station-row");
      const map = new Map();
      for(const row of rows){
        const idx = Number(row.dataset.stidx);
        map.set(idx, row.offsetTop + row.offsetHeight/2);
      }
      return map;
    }

    function assignLanes(trainPoints, baseOffsets, yThresholdPx){
      const pts = [...trainPoints].sort((a,b)=>a.yPx-b.yPx);
      const lanes = [];
      for(const p of pts){
        let laneIndex = -1;
        for(let i=0;i<lanes.length;i++){
          if(Math.abs(p.yPx - lanes[i]) > yThresholdPx){
            laneIndex = i;
            break;
          }
        }
        if(laneIndex === -1){
          laneIndex = lanes.length;
          lanes.push(-1e9);
        }
        lanes[laneIndex] = p.yPx;
        p.laneIndex = laneIndex;

        const step = (baseOffsets.length >= 2) ? (baseOffsets[1] - baseOffsets[0]) : 50;
        p.offsetPx = baseOffsets[laneIndex] ?? (baseOffsets[baseOffsets.length-1] + (laneIndex - (baseOffsets.length-1)) * step);

        const k = Math.floor((laneIndex + 1) / 2);
        const sign = (laneIndex % 2 === 1) ? 1 : -1;
        p.yJitter = (laneIndex === 0) ? 0 : Math.min(24, 8 * k) * sign;
      }
      return pts;
    }

    function renderTrains(displayDate){
      if(!scheduleUp || !scheduleDown) return;

      const baseSec = displayDate.getHours()*3600 + displayDate.getMinutes()*60 + displayDate.getSeconds();
      const nowAbs = (CUTOVER_SEC > 0 && baseSec <= CUTOVER_SEC) ? baseSec + 86400 : baseSec;

      const yMap = buildStationYMap();
      const yFromY01 = (y01) => {
        const idxFloat = y01 * (STATION_COUNT - 1);
        const idx0 = Math.floor(idxFloat);
        const idx1 = Math.min(STATION_COUNT-1, idx0+1);
        const frac = idxFloat - idx0;

        const y0 = yMap.get(idx0);
        const y1 = yMap.get(idx1);
        if(y0 == null || y1 == null) return null;
        return y0 + (y1 - y0) * frac;
      };

      const upPts = [];
      const downPts = [];
      const branchPts = [];

      const collect = (train) => {
        const hasMainlineStops = !!(train.stops && train.stops.length);
        const hasBranchStops = !!(train.displayStops && train.displayStops.some(s => isActualIABranchStop(s)));
        if(!hasMainlineStops && !hasBranchStops) return;

        const branchPos = calcIABranchPosition(train, nowAbs);
        if(branchPos){
          const destLabel = trainDestFallback(train);
          const color = typeColor(train.type);
          const textColor = idealTextColor(color);
          const sideClass = (train.dir === "up") ? "left" : "right";
          branchPts.push({
            train,
            xPx: branchPos.x,
            yPx: branchPos.y,
            rot: (train.dir === "up") ? 0 : 180,
            sideClass,
            stopped: branchPos.stopped,
            atStationIdx: branchPos.atStationIdx,
            nameLine: train.dest ? `${train.dest} 行` : (train.name ? train.name : ""),
            lastTrainNote: (lastTrainIdsByDest.has(train.trainId) && destLabel) ? `${destLabel} 行き 終電` : "",
            trainNoLabel: train.trainNo ? train.trainNo : "ー",
            color,
            textColor
          });
          return;
        }

        const p = calcTrainPosition(train, nowAbs);
        if(p.status === "not_in_service" || p.y01 == null) return;

        const yInWrap = yFromY01(p.y01);
        if(yInWrap == null) return;

        const rot = (train.dir === "up") ? 0 : 180;
        const nameLine = train.dest ? `${train.dest} 行` : (train.name ? train.name : "");
        const destLabel = trainDestFallback(train);
        const trainNoLabel = train.trainNo ? train.trainNo : "ー";
        const lastTrainNote = (lastTrainIdsByDest.has(train.trainId) && destLabel)
          ? `${destLabel} 行き 終電`
          : "";

        const color = typeColor(train.type);
        const textColor = idealTextColor(color);

        const item = {
          train,
          yPx: yInWrap,
          rot,
          stopped: (p.status === "stopped"),
          atStationIdx: (p.status === "stopped") ? p.atStationIdx : null,
          nameLine,
          lastTrainNote,
          trainNoLabel,
          color,
          textColor
        };

        if(train.dir === "up") upPts.push(item);
        else downPts.push(item);
      };

      for(const t of scheduleUp.trains) collect(t);
      for(const t of scheduleDown.trains) collect(t);

      const upOffsetsBase   = [-35, -57, -80, -102, -125, -147];
      const downOffsetsBase = [  35,  57,  80,  102,  125,  147];
      const yThreshold = 60;

      const upAssigned = assignLanes(upPts, upOffsetsBase, yThreshold);
      const downAssigned = assignLanes(downPts, downOffsetsBase, yThreshold);

      function markStoppedStackFixed(list, side){
        const groups = new Map();
        for(const it of list){
          it.stopRank = 0;
          if(!it.stopped || it.atStationIdx == null) continue;

          const key = `${side}:${it.atStationIdx}`;
          if(!groups.has(key)) groups.set(key, []);
          groups.get(key).push(it);
        }

        for(const [key, arr] of groups){
          const order = stopStackMap.get(key) ? [...stopStackMap.get(key)] : [];
          const nowIds = new Set(arr.map(it => it.train.trainId));
          const pruned = order.filter(id => nowIds.has(id));

          const newcomers = arr
            .map(it => it.train.trainId)
            .filter(id => !pruned.includes(id))
            .sort((a,b)=>String(a).localeCompare(String(b), "ja"));

          const newOrder = pruned.concat(newcomers);
          stopStackMap.set(key, newOrder);

          const idxMap = new Map(newOrder.map((id,i)=>[id,i]));
          for(const it of arr){
            it.stopRank = idxMap.get(it.train.trainId) ?? 0;
          }
        }

        for(const k of [...stopStackMap.keys()]){
          if(!k.startsWith(side + ":")) continue;
          if(!groups.has(k)) stopStackMap.delete(k);
        }
      }

      markStoppedStackFixed(upAssigned, "up");
      markStoppedStackFixed(downAssigned, "down");
      markStoppedStackFixed(branchPts.filter(it => it.sideClass === "left"), "branch-left");
      markStoppedStackFixed(branchPts.filter(it => it.sideClass === "right"), "branch-right");

      const nodes = [];
      const addNode = (it, sideClass) => {
        const train = it.train;
        const stoppedTag = it.stopped ? `<div class="stopped-tag">停車中</div>` : "";

        const labelHidden =
          (labelMode === "toggle" && !labelOpenMap.get(train.trainId)) ? "hidden" : "";

        const STEP_OUT = (window.matchMedia("(max-width: 900px)").matches) ? 60 : 100;
        const extra = (it.stopped && it.stopRank > 0) ? (it.stopRank * STEP_OUT) : 0;
        const sign = (sideClass === "left") ? -1 : 1;
        const finalOffset = it.offsetPx + sign * extra;

        nodes.push(`
          <div class="train ${sideClass}" data-trainid="${escapeHtml(train.trainId)}"
               style="top:${it.yPx + (it.yJitter || 0)}px; margin-left:${finalOffset}px;">
            ${stoppedTag}
            <div class="pentagon" data-role="pentagon"
                 style="background:${escapeHtml(it.color)}; --rot:${it.rot}deg;"></div>

            <div class="train-label ${labelHidden}" data-role="label">
              <span class="no">${escapeHtml(it.trainNoLabel)}</span>
              <span class="type"
                    style="background:${escapeHtml(it.color)}; border-color:${escapeHtml(it.color)}; color:${escapeHtml(it.textColor)};">
                ${escapeHtml(train.type || "種別")}
              </span>
              <div class="sub">${escapeHtml(it.nameLine || "")}</div>
              ${it.lastTrainNote ? `<div class="meta">${escapeHtml(it.lastTrainNote)}</div>` : ""}
            </div>
          </div>
        `);
      };

      const addBranchNode = (it) => {
        const train = it.train;
        const stoppedTag = it.stopped ? `<div class="stopped-tag">停車中</div>` : "";
        const labelHidden =
          (labelMode === "toggle" && !labelOpenMap.get(train.trainId)) ? "hidden" : "";
        const baseOffset = (it.sideClass === "left") ? -34 : 34;
        const extra = (it.stopped && it.stopRank > 0) ? (it.stopRank * 26) : 0;
        const signedExtra = (it.sideClass === "left") ? -extra : extra;

        nodes.push(`
          <div class="train branch ${it.sideClass}" data-trainid="${escapeHtml(train.trainId)}"
               style="left:${it.xPx + baseOffset + signedExtra}px; top:${it.yPx}px;">
            ${stoppedTag}
            <div class="pentagon" data-role="pentagon"
                 style="background:${escapeHtml(it.color)}; --rot:${it.rot}deg;"></div>

            <div class="train-label ${labelHidden}" data-role="label">
              <span class="no">${escapeHtml(it.trainNoLabel)}</span>
              <span class="type"
                    style="background:${escapeHtml(it.color)}; border-color:${escapeHtml(it.color)}; color:${escapeHtml(it.textColor)};">
                ${escapeHtml(train.type || "種別")}
              </span>
              <div class="sub">${escapeHtml(it.nameLine || "")}</div>
              ${it.lastTrainNote ? `<div class="meta">${escapeHtml(it.lastTrainNote)}</div>` : ""}
            </div>
          </div>
        `);
      };

      for(const it of upAssigned) addNode(it, "left");
      for(const it of downAssigned) addNode(it, "right");
      for(const it of branchPts) addBranchNode(it);

      trainsLayer.innerHTML = nodes.join("");

      runtimeHint.textContent =
        `表示中の列車数: ${upAssigned.length + downAssigned.length + branchPts.length}（上り:${upAssigned.length} / 下り:${downAssigned.length} / 分岐:${branchPts.length}）`;

      trainsLayer.querySelectorAll(".train").forEach(el=>{
        const id = el.dataset.trainid;
        const train = findTrainById(id);
        if(!train) return;

        const pent = el.querySelector('[data-role="pentagon"]');
        const label = el.querySelector('[data-role="label"]');

        if(label){
          label.addEventListener("click", (e)=>{
            e.stopPropagation();
            openModalForTrain(train);
          });
        }

        if(pent){
          pent.addEventListener("click", (e)=>{
            e.stopPropagation();
            if(labelMode === "toggle"){
              const cur = !!labelOpenMap.get(train.trainId);
              labelOpenMap.set(train.trainId, !cur);
              tick();
            }else{
              openModalForTrain(train);
            }
          });
        }
      });
    }

    function trainDestFallback(train){
      const d = String(train.dest ?? "").trim();
      if(d) return d;
      if(train.stops?.length) return train.stops[train.stops.length - 1].stationName;
      return "";
    }

    function getVisibleRemarkText(train){
      const rawRemark = String(train?.remark ?? "").trim();
      if(!rawRemark.endsWith("?")) return "";
      return rawRemark.slice(0, -1).trim();
    }

    function normalizeStationRef(stationRef){
      if(typeof stationRef === "number"){
        return { stationIdx: stationRef, code: "", name: "" };
      }
      if(stationRef && typeof stationRef === "object"){
        return {
          stationIdx: Number.isFinite(stationRef.stationIdx) ? stationRef.stationIdx : null,
          code: String(stationRef.code ?? "").trim(),
          name: String(stationRef.name ?? "").trim(),
        };
      }
      return { stationIdx: null, code: "", name: "" };
    }

    function stationRefKey(stationRef){
      const ref = normalizeStationRef(stationRef);
      if(Number.isFinite(ref.stationIdx)) return `idx:${ref.stationIdx}`;
      if(ref.code) return `code:${ref.code}`;
      if(ref.name) return `name:${ref.name}`;
      return "";
    }

    function readStationIdxValue(v){
      const s = String(v ?? "").trim();
      if(!s) return null;
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function stationRefMatchesStop(stationRef, stop){
      const ref = normalizeStationRef(stationRef);
      if(!stop) return false;
      if(Number.isFinite(ref.stationIdx) && Number.isFinite(stop.stationIdx) && ref.stationIdx === stop.stationIdx) return true;
      if(ref.code){
        return String(stop.code ?? "").trim() === ref.code;
      }
      if(ref.name){
        return String(stop.stationName ?? "").trim() === ref.name;
      }
      return false;
    }

    function resolveStationRefInfo(stationRef){
      const ref = normalizeStationRef(stationRef);
      if(Number.isFinite(ref.stationIdx)){
        const st = scheduleUp?.stations?.find(x => x.idx === ref.stationIdx) || scheduleDown?.stations?.find(x => x.idx === ref.stationIdx);
        if(st) return { stationIdx: st.idx, code: st.code, name: st.name };
      }

      if(ref.code || ref.name){
        const trains = [...(scheduleUp?.trains || []), ...(scheduleDown?.trains || [])];
        for(const train of trains){
          const stop = (train.displayStops || train.stops || []).find(s => stationRefMatchesStop(ref, s));
          if(stop){
            return {
              stationIdx: Number.isFinite(stop.stationIdx) ? stop.stationIdx : null,
              code: String(stop.code ?? ref.code).trim(),
              name: String(stop.stationName ?? ref.name).trim(),
            };
          }
        }
      }

      return ref;
    }

    function buildDepartureBoardNote(train, stationRef){
      const notes = [];
      const destName = trainDestFallback(train).trim();
      const rawRemark = String(train?.remark ?? "").trim();
      const remarkText = getVisibleRemarkText(train);
      let hasStopNote = false;

      if(remarkText){
        notes.push(remarkText);
      }

      if(lastTrainIdsByDest.has(train.trainId)){
        notes.push(destName ? `${destName} 行き 最終列車` : "最終列車");
      }

      if(!rawRemark){
        const stops = train.displayStops?.length ? train.displayStops : (train.stops || []);
        const boardIndex = stops.findIndex(s => stationRefMatchesStop(stationRef, s));
        if(boardIndex >= 0){
          const laterStops = stops.slice(boardIndex + 1);
          const hasPassOnly = laterStops.some(s => s.passAbs != null && s.arrAbs == null && s.depAbs == null);
          if(hasPassOnly){
            const stopNames = laterStops
              .filter(s => (s.arrAbs != null || s.depAbs != null) && s.stationName)
              .map(s => String(s.stationName).trim())
              .filter(name => name && name !== destName)
              .filter((name, idx, arr) => arr.indexOf(name) === idx);
            if(stopNames.length){
              hasStopNote = true;
              notes.push(`停車駅：${stopNames.join("・")}`);
            }
          }
        }
      }

      const text = notes.join(" / ");
      return {
        text,
        marquee: hasStopNote || text.length >= 18,
      };
    }

    function collectDeparturesForStation(trains, stationRef){
      const refInfo = resolveStationRefInfo(stationRef);
      const refName = String(refInfo?.name ?? "").trim();
      const out = [];
      for(const t of (trains || [])){
        const allStops = t.displayStops?.length ? t.displayStops : t.stops;
        const s = allStops?.find(x => stationRefMatchesStop(refInfo, x));
        if(!s) continue;

        const lastStop = allStops?.length ? allStops[allStops.length - 1] : null;
        const lastStopIdx = lastStop?.stationIdx ?? null;

        let timeAbs = null;

        if(s.depAbs != null){
          timeAbs = s.depAbs;
        }else if(s.passAbs != null){
          continue; // 通過は非表示
        }else{
          continue;
        }

        const hh = Math.floor(((timeAbs % 86400) + 86400) % 86400 / 3600);
        const mm = Math.floor((((timeAbs % 86400) + 86400) % 86400) % 3600 / 60);

        const dest = trainDestFallback(t);
        const type = String(t.type ?? "").trim();
        const note = buildDepartureBoardNote(t, {
          stationIdx: Number.isFinite(s.stationIdx) ? s.stationIdx : null,
          code: s.code,
          name: s.stationName,
        });

        const firstStop = allStops?.length ? allStops[0] : null;
        const isOrigin = (refName && String(t.origin ?? "").trim() === refName)
          || (!!firstStop && stationRefMatchesStop(refInfo, firstStop));

        out.push({
          abs: timeAbs,
          h: hh,
          m: mm,
          type,
          dest,
          destInitial: getDestInitial(dest),
          trainNo: String(t.trainNo ?? "").trim(),
          cars: String(t.cars ?? "").trim(),
          noteText: note.text,
          noteMarquee: note.marquee,
          isOrigin,
          trainId: t.trainId,
        });
      }

      out.sort((a,b)=> (a.abs - b.abs) || String(a.trainNo).localeCompare(String(b.trainNo), "ja"));
      return out;
    }

    function sortHoursFromStart(hours, startHour){
      const uniq = [...new Set(hours)].filter(h => Number.isFinite(h)).map(h => Number(h));
      uniq.sort((a,b)=>{
        const aa = (a - startHour + 24) % 24;
        const bb = (b - startHour + 24) % 24;
        return aa - bb;
      });
      return uniq;
    }

    function buildStationTtHtml(list, label){
      if(!list.length){
        return `<div style="color:var(--muted); font-size:13px; font-weight:800; padding: 6px 2px;">${escapeHtml(label)}の時刻表データがありません</div>`;
      }

      const byHour = new Map();
      for(const it of list){
        if(!byHour.has(it.h)) byHour.set(it.h, []);
        byHour.get(it.h).push(it);
      }

      const hours = sortHoursFromStart([...byHour.keys()], 4);

      let rows = "";
      for(const h of hours){
        const arr = byHour.get(h) || [];
        const mins = arr.map(it=>{
          const color = typeColor(it.type);
          const title = `${it.type || "種別"} / ${it.dest || ""} / ${it.trainNo || ""}`;
          return `
            <span class="tt-min ${it.isOrigin ? "origin" : ""}"
                  data-type="${escapeHtml(it.type || "")}"
                  data-trainid="${escapeHtml(it.trainId || "")}"
                  style="--c:${escapeHtml(color)}"
                  title="${escapeHtml(title)}">
              <span class="m">${pad2(it.m)}</span>
              <span class="dest">${escapeHtml(it.destInitial)}</span>
              <span class="ptype">${escapeHtml(it.type || "種別")}</span>
            </span>
          `;
        }).join("");

        rows += `
          <tr>
            <th class="hour" scope="row">${pad2(h)}</th>
            <td><div class="tt-minwrap">${mins}</div></td>
          </tr>
        `;
      }

      return `
        <table class="tt-table" aria-label="${escapeHtml(label)}の発車時刻表">
          <thead>
            <tr>
              <th class="hour" scope="col">時</th>
              <th scope="col">分（右上：行先頭文字）</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function getDepartureBoardState(list){
      const disp = getDisplayDate();
      const baseSec = disp.getHours()*3600 + disp.getMinutes()*60 + disp.getSeconds();
      const hasAfterMidnight = list.some(it => it.abs >= 86400);

      if(CUTOVER_SEC > 0 && hasAfterMidnight && baseSec <= CUTOVER_SEC){
        const nowAbs = baseSec + 86400;
        return {
          ended: false,
          items: list.filter(it => it.abs >= nowAbs),
        };
      }

      if(baseSec < 10800){
        return { ended: true, items: [] };
      }
      return {
        ended: false,
        items: list.filter(it => it.abs >= baseSec),
      };
    }

    function buildDepartureBoardHtml(list, isEnded = false){
      const rows = [];
      if(isEnded || !list.length){
        rows.push(`
          <div class="dep-board-row empty">
            <div></div><div></div><div></div><div></div><div></div>
          </div>
        `);
        rows.push(`
          <div class="dep-board-row">
            <div class="message">本日の運転は終了しました</div>
          </div>
        `);
        rows.push(`
          <div class="dep-board-row empty">
            <div></div><div></div><div></div><div></div><div></div>
          </div>
        `);
      } else {
      for(let i=0;i<3;i++){
        const it = list[i] || null;
        if(!it){
          rows.push(`
            <div class="dep-board-row empty">
              <div></div><div></div><div></div><div></div><div></div>
            </div>
          `);
          continue;
        }

        const c = typeColor(it.type);
        const txt = idealTextColor(c);
        const carsText = it.cars ? `${escapeHtml(it.cars)}両` : "—";
        const noteText = escapeHtml(it.noteText || "—");
        const rawNoteLen = String(it.noteText || "").length;
        const noteSizeClass = rawNoteLen >= 56 ? " micro" : (rawNoteLen >= 40 ? " tiny" : (rawNoteLen >= 24 ? " compact" : ""));

        rows.push(`
          <div class="dep-board-row">
            <div class="type" style="background:${escapeHtml(c)}; color:${escapeHtml(txt)};">${escapeHtml(it.type || "—")}</div>
            <div class="time">${escapeHtml(`${pad2(it.h)}:${pad2(it.m)}`)}</div>
            <div class="dest">${escapeHtml(it.dest || "—")}</div>
            <div class="cars">${carsText}</div>
            <div class="note${noteSizeClass}"><span class="note-text">${noteText}</span></div>
          </div>
        `);
      }
      }

      return `
        <div class="dep-board">
          <div class="dep-board-head">
            <div>種別</div>
            <div>時刻</div>
            <div>行先</div>
            <div>両数</div>
            <div>備考</div>
          </div>
          ${rows.join("")}
        </div>
      `;
    }

    function renderDepartureBoard(stationRef){
      if(!scheduleUp || !scheduleDown) return;

      const st = resolveStationRefInfo(stationRef);
      const stName = st?.name ?? "駅";
      const stCode = st?.code ?? "";
      const upState = getDepartureBoardState(collectDeparturesForStation(scheduleUp.trains, st));
      const downState = getDepartureBoardState(collectDeparturesForStation(scheduleDown.trains, st));

      depBoardTitle.innerHTML = `
        <div class="main">${escapeHtml(stName)} <span style="color:var(--muted); font-weight:900;">${escapeHtml(stCode)}</span></div>
      `;
      depCountUp.textContent = `(${Math.min(3, upState.items.length)}本)`;
      depCountDown.textContent = `(${Math.min(3, downState.items.length)}本)`;
      depPanelUp.innerHTML = buildDepartureBoardHtml(upState.items, upState.ended);
      depPanelDown.innerHTML = buildDepartureBoardHtml(downState.items, downState.ended);
    }

    function openDepartureBoard(stationRef){
      if(!scheduleUp || !scheduleDown) return;

      const st = resolveStationRefInfo(stationRef);
      depBoardModal.dataset.openStationKey = stationRefKey(st);
      depBoardModal.dataset.openStationIdx = Number.isFinite(st.stationIdx) ? String(st.stationIdx) : "";
      depBoardModal.dataset.openStationCode = st.code || "";
      depBoardModal.dataset.openStationName = st.name || "";
      renderDepartureBoard(st);

      modal.classList.remove("show");
      settingsModal.classList.remove("show");
      stationTtModal.classList.remove("show");
      depBoardModal.classList.add("show");
      showBackdrop();
      setDepBoardTab("up");
      modalBackState = null;
      modalBack.hidden = true;
      stationTtBack.hidden = true;
    }

    function renderTypeLegendFromLists(...lists){
      const set = new Set();
      for(const list of lists){
        for(const it of (list || [])){
          const t = String(it?.type ?? "").trim();
          if(t) set.add(t);
        }
      }
      const types = [...set];

      types.sort((a,b)=>{
        const aIn = Object.prototype.hasOwnProperty.call(TYPE_COLOR, a);
        const bIn = Object.prototype.hasOwnProperty.call(TYPE_COLOR, b);
        if(aIn && !bIn) return -1;
        if(!aIn && bIn) return 1;
        return String(a).localeCompare(String(b), "ja");
      });

      if(!types.length){
        ttTypeLegend.innerHTML = "";
        return;
      }

      ttTypeLegend.innerHTML = types.map(t=>{
        const c = typeColor(t);
        const txt = idealTextColor(c);
        return `<button type="button" class="tt-typechip" data-type="${escapeHtml(t)}"
                  style="background:${escapeHtml(c)}; border-color:${escapeHtml(c)}; color:${escapeHtml(txt)};">
                  ${escapeHtml(t)}
                </button>`;
      }).join("");

      ttTypeLegend.querySelectorAll(".tt-typechip").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const t = String(btn.dataset.type ?? "").trim();
          if(!t) return;
          stationTypeFilter = (stationTypeFilter === t) ? null : t;
          applyStationTypeFilterVisuals();
        });
      });

      applyStationTypeFilterVisuals();
    }

    function renderDestLegendFromLists(...lists){
      const pairs = new Map();

      for(const list of lists){
        for(const it of (list || [])){
          const abbr = String(it?.destInitial ?? "").trim();
          const dest = String(it?.dest ?? "").trim();
          if(!abbr || !dest) continue;
          if(!pairs.has(abbr)) pairs.set(abbr, dest);
        }
      }

      if(!pairs.size){
        ttDestLegend.innerHTML = "";
        return;
      }

      const items = [...pairs.entries()].sort((a,b)=>String(a[0]).localeCompare(String(b[0]), "ja"));
      ttDestLegend.innerHTML = items.map(([abbr, dest]) =>
        `<span class="tt-destitem"><span class="abbr">${escapeHtml(abbr)}</span><span>：${escapeHtml(dest)}</span></span>`
      ).join("");
    }

    function applyStationTypeFilterVisuals(){
      stationTtModal.querySelectorAll(".tt-min").forEach(el=>{
        const t = String(el.dataset.type ?? "").trim();
        const dim = (stationTypeFilter && t !== stationTypeFilter);
        el.classList.toggle("dim", !!dim);
      });

      ttTypeLegend.querySelectorAll(".tt-typechip").forEach(btn=>{
        const t = String(btn.dataset.type ?? "").trim();
        const isOn = (!!stationTypeFilter && t === stationTypeFilter);
        const isDim = (!!stationTypeFilter && t !== stationTypeFilter);
        btn.classList.toggle("on", isOn);
        btn.classList.toggle("dim", isDim);

        if(isDim){
          btn.style.background = "var(--dimBg)";
          btn.style.borderColor = "var(--dimBorder)";
          btn.style.color = "var(--dimText)";
        }else{
          const c = typeColor(t);
          const txt = idealTextColor(c);
          btn.style.background = c;
          btn.style.borderColor = c;
          btn.style.color = txt;
        }
      });
    }

    function openTrainFromStationChip(trainId, stationRef){
      const train = findTrainById(trainId);
      if(!train) return;
      const st = resolveStationRefInfo(stationRef);
      openModalForTrain(train, Number.isFinite(st.stationIdx) ? st.stationIdx : null, {
        type: "station",
        stRef: st,
      });
    }

    function bindStationTimetableTrainOpenHandlers(){
      const handler = (e)=>{
        const chip = e.target.closest(".tt-min");
        if(!chip) return;

        const trainId = String(chip.dataset.trainid ?? "").trim();
        if(!trainId) return;

        openTrainFromStationChip(trainId, {
          stationIdx: readStationIdxValue(stationTtModal.dataset.openStationIdx),
          code: String(stationTtModal.dataset.openStationCode ?? ""),
          name: String(stationTtModal.dataset.openStationName ?? ""),
        });
      };

      ttPanelUp.addEventListener("click", handler);
      ttPanelDown.addEventListener("click", handler);
    }
    bindStationTimetableTrainOpenHandlers();

    function openStationTimetable(stationRef, backState = null){
      if(!scheduleUp || !scheduleDown) return;

      const st = resolveStationRefInfo(stationRef);
      stationTtModal.dataset.openStationKey = stationRefKey(st);
      stationTtModal.dataset.openStationIdx = Number.isFinite(st.stationIdx) ? String(st.stationIdx) : "";
      stationTtModal.dataset.openStationCode = st.code || "";
      stationTtModal.dataset.openStationName = st.name || "";
      stationTypeFilter = null;
      const stName = st?.name ?? "駅";
      const stCode = st?.code ?? "";

      stationTtTitle.innerHTML = `
        <div class="main">駅時刻表：${escapeHtml(stName)} <span style="color:var(--muted); font-weight:900;">${escapeHtml(stCode)}</span></div>
        <div class="sub">発車時刻を押すと列車時刻表が表示されます</div>
      `;

      const upList = collectDeparturesForStation(scheduleUp.trains, st);
      const downList = collectDeparturesForStation(scheduleDown.trains, st);

      ttCountUp.textContent = `(${upList.length}本)`;
      ttCountDown.textContent = `(${downList.length}本)`;

      ttPanelUp.innerHTML = buildStationTtHtml(upList, "上り");
      ttPanelDown.innerHTML = buildStationTtHtml(downList, "下り");

      renderTypeLegendFromLists(upList, downList);
      renderDestLegendFromLists(upList, downList);
      setStationTtTab("up");

      modal.classList.remove("show");
      settingsModal.classList.remove("show");
      stationTtModal.classList.add("show");
      showBackdrop();
      modalBackState = backState;
      stationTtBack.hidden = !backState;
      modalBack.hidden = true;
    }

    async function loadAll(){
      dataStatus.innerHTML = "データ: 読み込み中…<br>（しばらくお待ちください）";

      const disp = getDisplayDate();
      const dayKey = getDayKey(disp);

      const csvUp   = CSV_BY_DAY[dayKey]?.up;
      const csvDown = CSV_BY_DAY[dayKey]?.down;

      if(!csvUp || !csvDown){
        throw new Error(`CSV_BY_DAY の設定が不正です（dayKey=${dayKey}）`);
      }

      const bust = `?ts=${Date.now()}`;

      const [upText, downText] = await Promise.all([
        fetch(csvUp + bust, {cache:"no-store"}).then(r => {
          if(!r.ok) throw new Error(`上りCSVの読み込み失敗: ${r.status}`);
          return r.text();
        }),
        fetch(csvDown + bust, {cache:"no-store"}).then(r => {
          if(!r.ok) throw new Error(`下りCSVの読み込み失敗: ${r.status}`);
          return r.text();
        }),
      ]);

      const refStations = extractStationsFromUpCsv(upText);

      scheduleUp   = parseScheduleWithRefStations(upText,   "up",   "UP",   refStations);
      scheduleDown = parseScheduleWithRefStations(downText, "down", "DOWN", refStations);

      STATION_COUNT = refStations.length;
      CUTOVER_SEC = computeCutoverSec(scheduleUp, scheduleDown);
      lastTrainIdsByDest = computeLastTrainIdsByDestination(scheduleUp, scheduleDown);

      buildStationsUI(refStations);

      dataStatus.innerHTML =
        `データ: 読み込み完了<br>（ダイヤ:${escapeHtml(dayKey)} / 駅 ${STATION_COUNT} / 上り列車 ${scheduleUp.trains.length} / 下り列車 ${scheduleDown.trains.length}）`;

      for(const k of [...labelOpenMap.keys()]){
        const exists = scheduleUp.trains.some(t=>t.trainId===k) || scheduleDown.trains.some(t=>t.trainId===k);
        if(!exists) labelOpenMap.delete(k);
      }

      requestAnimationFrame(() => tick());
    }

    function sleep(ms){
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function setLoadingOverlayText(mainText, subText = "しばらくお待ちください"){
      loadingMain.textContent = mainText;
      loadingSub.textContent = subText;
    }

    async function withLoadingOverlay(task, minMs = 2000, mainText = "列車位置データを読み込み中です", subText = "しばらくお待ちください"){
      const startedAt = Date.now();
      setLoadingOverlayText(mainText, subText);
      loadingOverlay.hidden = false;
      loadingOverlay.classList.add("show");

      try{
        return await task();
      }finally{
        const elapsed = Date.now() - startedAt;
        const remain = Math.max(0, minMs - elapsed);
        if(remain > 0) await sleep(remain);
        loadingOverlay.classList.remove("show");
        loadingOverlay.hidden = true;
        setLoadingOverlayText("列車位置データを読み込み中です", "しばらくお待ちください");
      }
    }

    function getDisplayDate(){
      const real = new Date();
      return new Date(real.getTime() + displayOffsetSec * 1000);
    }

    function hardReloadPage(){
      const url = new URL(window.location.href);
      url.searchParams.set("_reload", String(Date.now()));
      window.location.replace(url.toString());
    }

    function tick(){
      const realNow = new Date();
      nowTimeEl.textContent = `現在時刻: ${formatNow(realNow)}`;
      const disp = getDisplayDate();
      displayTimeEl.textContent = formatNow(disp);
      renderTrains(disp);
      updateTrainModalRailPosition();
      if(depBoardModal.classList.contains("show")){
        const activeTab = getActiveDepBoardTab();
        renderDepartureBoard({
          stationIdx: readStationIdxValue(depBoardModal.dataset.openStationIdx),
          code: String(depBoardModal.dataset.openStationCode ?? ""),
          name: String(depBoardModal.dataset.openStationName ?? ""),
        });
        setDepBoardTab(activeTab);
      }
    }

    btnRefresh.addEventListener("click", ()=>{
      hardReloadPage();
    });

    btnCsvReload.addEventListener("click", async ()=>{
      try{
        await withLoadingOverlay(async ()=>{
          await loadSiteConfig();
          await loadAll();
          closeAllModals();
        });
      }
      catch(e){
        console.error(e);
        dataStatus.innerHTML = "データ: 読み込み失敗<br>（コンソールを確認）";
        alert(String(e?.message ?? e));
      }
    });

    (function initSettings(){
      labelMode = loadLabelMode();
      displayTimeVisibility = loadDisplayTimeVisibility();
      showPassStopsMode = loadShowPassStopsMode();
      applyDisplayTimeVisibility();
    })();

    document.documentElement.style.setProperty("--line", LINE_COLOR);

    (async function init(){
      syncFullscreenButtons();
      await loadSiteConfig();
      try{ await loadAll(); }
      catch(e){
        console.error(e);
        dataStatus.innerHTML = "データ: 読み込み失敗<br>（CSVファイル名/配置を確認）";
        alert(String(e?.message ?? e));
      }
      tick();
      const updateSec = configNumber("train_position_update_interval_seconds", 1);
      const updateMs = Math.max(1, updateSec) * 1000;
      setInterval(tick, updateMs);
    })();

    window.addEventListener("resize", ()=>{
      if(scheduleUp?.stations) buildStationsUI(scheduleUp.stations);
      tick();
    });
  </script>
</body>

<!doctype html><!--2026/03/02  新CSV対応版：駅番号列追加 + 備考2行目 + 13行目(始発駅到着)で発車前表示 -->
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>架空鉄道　列車走行位置</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-PEPMXC34MD"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-PEPMXC34MD');
  </script>

  <style>
    :root{
      --line:#399E92;
      --header:#144479;
      --header2:#399E92;
      --bg:#F3F5F8;
      --panel:#FFFFFF;
      --text:#17212b;
      --muted:#6b7b8a;
      --divider:rgba(0,0,0,.08);
      --shadow: 0 10px 24px rgba(0,0,0,.10);

      --rowH: 78px;
      --trackW: 10px;
      --node: 18px;
      --sidePad: 14px;
      --centerX: 50%;

      --footerH: 64px;

      /* ★絞り込み時の薄グレー */
      --dimText: #9aa3ad;
      --dimBorder: rgba(0,0,0,.10);
      --dimBg: rgba(243,245,248,.75);
      --lastTrainText: #9a2f2f;
    }

    *{ box-sizing:border-box; }
    [hidden]{ display:none !important; }
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color:var(--text);
    }
    @media (max-width: 640px){
      #btnEnterFullscreen,
      #btnExitFullscreen{
        display:none !important;
      }
      html, body{
        overscroll-behavior-y: none;
      }
      body{
        overscroll-behavior: none;
      }
    }

    header{
      position:sticky;
      top:0;
      z-index:30;
      box-shadow: 0 2px 10px rgba(0,0,0,.10);
    }

    /* ===== Top bar ===== */
    .topbar{
      background: var(--header);
      color:#fff;
      height:48px;
      display:flex;
      align-items:center;
      padding: 0 var(--sidePad);
      gap: 10px;
    }
    .topbar .leftgrp,
    .topbar .rightgrp{
      display:flex;
      align-items:center;
      gap:8px;
      flex: 0 0 auto;
      min-width: 0;
    }
    .topbar .title{
      font-weight:900;
      letter-spacing:.02em;
      font-size: 16px;
      flex:1 1 auto;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .iconbtn{
      width:34px;height:34px;
      border-radius:10px;
      border:1px solid rgba(255,255,255,.35);
      background: rgba(255,255,255,.15);
      color:#fff;
      display:grid;
      place-items:center;
      cursor:pointer;
      flex: 0 0 auto;
      font-weight:900;
      font-size: 20px;
      line-height: 1;
    }
    .iconbtn:active{ transform: translateY(1px); }
    .iconbtn.fs-icon{
      position: relative;
      overflow: hidden;
      font-size: 0;
    }
    .iconbtn.fs-icon .win{
      position: relative;
      display:block;
      width: 16px;
      height: 12px;
      border: 2px solid currentColor;
      border-radius: 2px;
    }
    .iconbtn.fs-icon .win::before{
      content:"";
      position:absolute;
      left:-2px;
      right:-2px;
      top:-2px;
      height: 3px;
      background: currentColor;
      border-radius: 2px 2px 0 0;
    }
    .iconbtn.fs-icon.exit .win::after{
      content:"";
      position:absolute;
      inset: 2px;
      border: 2px solid currentColor;
      border-radius: 1px;
      opacity:.7;
    }

    /* ヘッダー：更新 + 現在時刻は1行固定 */
    .subbar{
      background: var(--header2);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 8px var(--sidePad);
      font-size: 12px;
      flex-wrap: nowrap;
      white-space: nowrap;
      position: relative;
    }
    .subbar .left{
      display:flex;
      align-items:center;
      gap:8px;
      flex: 0 0 auto;
      min-width: 0;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      white-space:nowrap;
      flex: 0 0 auto;
      min-width: 0;
      overflow:hidden;
      text-overflow: ellipsis;
      max-width: 70vw;
    }
    .subbar button,
    .subbar a{
      appearance:none;
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(255,255,255,.08);
      color:#fff;
      border-radius: 999px;
      padding: 6px 9px;
      font-weight:800;
      font-size: 11px;
      line-height: 1.1;
      cursor:pointer;
      flex: 0 0 auto;
      text-decoration:none;
    }
    .subbar button:active{ transform: translateY(1px); }

    /* iボタンで開閉する情報パネル */
    .info-panel{
      background:#fff;
      border-bottom: 1px solid var(--divider);
      padding: 8px var(--sidePad);
      color: var(--muted);
      font-size: 12px;
    }
    .info-row{
      padding: 2px 0;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    #dataStatus{
      white-space: normal;
      overflow: visible;
      text-overflow: clip;
      line-height: 1.45;
    }
    #runtimeHint{
      padding-left: 1em;
    }

    main{
      max-width: 980px;
      margin: 0 auto;
      padding: 10px 10px calc(24px + var(--footerH));
    }

    .board{
      background: var(--panel);
      border: 1px solid var(--divider);
      border-radius: 14px;
      overflow:hidden;
      box-shadow: var(--shadow);
    }

    .board-body{
      position:relative;
      height: calc(100svh - var(--headerH, 190px) - var(--footerH) + 70px);
      min-height: 560px;
      overflow:auto;
      background: #fff;
    }

    .line-wrap{
      position:relative;
      min-width: 0;
    }

    .track-layer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index: 1;
    }
    .track{
      position:absolute;
      left: var(--centerX);
      transform: translateX(-50%);
      top: calc(var(--rowH) / 2);
      bottom: calc(var(--rowH) / 2);
      width: var(--trackW);
      background: var(--line);
      border-radius: 999px;
      box-shadow: 0 0 0 6px rgba(57,158,146,.12);
    }

    .stations{
      position:relative;
      display:block;
      z-index: 0;
    }
    .station-row{
      position:relative;
      height: var(--rowH);
      display:flex;
      align-items:center;
      padding: 0 var(--sidePad);
      border-bottom: 1px solid rgba(0,0,0,.04);
    }
    .station-row:nth-child(odd){ background: #F8FAFC; }

    .st-left{
      width: calc(50% - 26px);
      padding-right: 10px;
      min-width:0;
      display:flex;
      align-items:center;
      gap:8px;
    }
    .st-main{
      min-width: 0;
      flex: 1 1 auto;
    }
    .depbtn{
      appearance:none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid rgba(20,68,121,.16);
      background: #eef2f7;
      color: #144479;
      display:grid;
      place-items:center;
      cursor:pointer;
      flex: 0 0 auto;
      padding:0;
    }
    .depbtn:active{ transform: translateY(1px); }
    .depbtn .screen{
      width: 13px;
      height: 9px;
      border: 2px solid currentColor;
      border-radius: 1px;
      position: relative;
      display:block;
    }
    .depbtn .screen::before{
      content:"";
      position:absolute;
      left: 1px;
      right: 1px;
      top: 1px;
      height: 1px;
      background: currentColor;
      opacity: .6;
    }
    .depbtn .screen::after{
      content:"";
      position:absolute;
      left: 50%;
      bottom: -4px;
      width: 6px;
      height: 1px;
      background: currentColor;
      transform: translateX(-50%);
    }
    .st-code{
      font-weight:900;
      font-size: 12px;
      color: var(--muted);
      letter-spacing:.02em;
      white-space:nowrap;
    }

    /* ===== 駅名：タップできるようボタン化 ===== */
    .st-namebtn{
      appearance:none;
      border:0;
      background:transparent;
      padding:0;
      margin:0;
      text-align:left;
      font-weight:900;
      font-size: 16px;
      line-height:1.15;
      margin-top: 2px;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
      word-break: keep-all;
      cursor:pointer;
      color: var(--text);
      width: 100%;
    }
    .st-namebtn:hover{ text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    .st-namebtn:focus-visible{
      outline: 3px solid rgba(57,158,146,.45);
      outline-offset: 2px;
      border-radius: 8px;
    }

    .st-sub{
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .st-right{
      width: calc(50% - 26px);
      padding-left: 10px;
      display:flex;
      justify-content:flex-end;
      align-items:center;
      gap:10px;
      color: var(--muted);
      font-size: 12px;
      min-width:0;
    }

    .node{
      position:absolute;
      left: var(--centerX);
      transform: translate(-50%, -50%);
      width: var(--node);
      height: var(--node);
      border-radius: 50%;
      background: #fff;
      border: 4px solid var(--line);
      box-shadow: 0 6px 16px rgba(0,0,0,.10);
      pointer-events:none;
      z-index: 2;
    }

    .trains-layer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index: 3;
    }
    .branch-layer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index: 0;
    }
    .branch-ui-layer{
      position:absolute;
      inset:0;
      pointer-events:none;
      z-index: 2;
    }
    .branch-seg{
      position:absolute;
      height: 8px;
      border-radius: 999px;
      transform-origin: 0 50%;
      box-shadow: 0 0 0 4px rgba(205,181,94,.14);
    }
    .branch-node{
      position:absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background:#fff;
      border: 4px solid #CDB55E;
      box-shadow: 0 6px 16px rgba(0,0,0,.10);
      transform: translate(-50%, -50%);
    }
    .branch-station-ui{
      position:absolute;
      right: var(--sidePad);
      transform: translateY(-50%);
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      min-width: 0;
      pointer-events:none;
    }
    .branch-station-ui .txt{
      text-align:right;
      min-width: 0;
      max-width: 150px;
      line-height: 1.15;
      color: var(--text);
      font-weight: 900;
      white-space: nowrap;
    }
    .branch-station-ui .code{
      display:block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 900;
    }
    .branch-station-ui .name{
      display:block;
      font-size: 16px;
      color: var(--text);
      font-weight: 900;
    }
    .branch-station-ui .st-namebtn,
    .branch-station-ui .branch-depbtn{
      pointer-events: auto;
    }
    .branch-depbtn{
      cursor: pointer;
      flex: 0 0 auto;
    }
    .train.branch{
      margin-left: 0 !important;
    }

    .train{
      position:absolute;
      left: var(--centerX);
      transform: translate(-50%, -50%);
      pointer-events:auto;
      cursor:pointer;
      user-select:none;
      touch-action: manipulation;
    }

    .pentagon{
      width: 20px;
      height: 20px;
      background: var(--line);
      clip-path: polygon(50% 0%, 100% 35%, 82% 100%, 18% 100%, 0% 35%);
      border: 2px solid rgba(255,255,255,.85);
      box-shadow: 0 10px 18px rgba(0,0,0,.14);
      transform-origin: 50% 50%;
      flex: 0 0 auto;
      cursor:pointer;
    }

    .train .pentagon{
      position:absolute;
      left:0;
      top:50%;
      transform: translate(-50%, -50%) rotate(var(--rot, 0deg));
      z-index: 2;
    }

    .train .stopped-tag{
      position:absolute;
      left:0;
      top: calc(50% - 22px);
      transform: translate(-50%, -100%);
      z-index: 3;
    }

    .train .train-label{
      position:absolute;
      top:50%;
      transform: translateY(-50%);
      z-index: 1;
    }

    .train.left  .train-label{ right: 16px; }
    .train.right .train-label{ left:  16px; }

    .train-label{
      background:#fff;
      border:1px solid rgba(0,0,0,.10);
      border-radius: 12px;
      padding: 4px 6px;
      box-shadow: 0 10px 18px rgba(0,0,0,.10);
      min-width: 80px;
      max-width: min(130px, 40vw);
      cursor:pointer;
      text-align: center;
    }
    .train-label.hidden{ display:none; }

    .train-label .no{
      display:block;
      font-variant-numeric: tabular-nums;
      color: rgba(0,0,0,.82);
      font-size: 11px;
    }

    .train-label .type{
      display:inline-flex;
      margin-top: 4px;
      justify-content:center;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 10px;
      white-space:nowrap;
      max-width: 160px;
      overflow:hidden;
      text-overflow: ellipsis;
    }

    .train-label .sub{
      display:block;
      margin-top: 4px;
      font-size: 10px;
      font-weight: 900;
      color: var(--muted);
      white-space:nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .train-label .meta{
      display:block;
      margin-top: 3px;
      font-size: 9px;
      font-weight: 900;
      color: var(--lastTrainText);
      white-space:nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .modal-last-train{
      color: var(--lastTrainText);
      font-weight: 900;
      margin-left: 8px;
      white-space: nowrap;
    }
    .modal-subline{
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    @media (max-width: 640px){
      #trainModalCard .modal-title .sub{
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
        max-width: calc(100vw - 110px);
        line-height: 1.35;
      }
      #trainModalCard .modal-subline{
        display: flex;
        align-items: flex-start;
        gap: 2px 8px;
      }
      #trainModalCard .modal-last-train{
        margin-left: 0;
      }
    }

    .stopped-tag{
      background: rgba(0,0,0,.72);
      color:#fff;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight:900;
      white-space:nowrap;
      pointer-events:none;
    }

    /* ===== フッター ===== */
    footer{
      position: fixed;
      left:0; right:0; bottom:0;
      z-index: 40;
      background: rgba(255,255,255,.92);
      backdrop-filter: blur(10px);
      border-top: 1px solid rgba(0,0,0,.10);
      height: var(--footerH);
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 -8px 24px rgba(0,0,0,.10);
    }
    .footer-inner{
      width: min(980px, 100%);
      padding: 8px 10px;
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
      white-space: nowrap;
    }

    .footer-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex: 0 0 auto;
      white-space:nowrap;
    }
    .timebox{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width: 160px;
      flex: 0 0 auto;
    }
    .timebox.is-hidden{
      display:none;
    }
    .timebox .label{
      font-size: 10px;
      color: var(--muted);
      font-weight:800;
      line-height:1.1;
    }
    .timebox .value{
      font-size: 12px;
      font-weight:900;
      font-variant-numeric: tabular-nums;
      line-height:1.1;
    }

    .footer-bottom{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      min-width: 0;
      flex: 1 1 auto;
    }
    .time-controls{
      display:flex;
      gap:4px;
      flex-wrap: nowrap;
      justify-content:flex-end;
      align-items:center;
      overflow:hidden;
    }

    .tbtn{
      appearance:none;
      border:1px solid rgba(0,0,0,.12);
      background: #f1f3f6;
      color: rgba(0,0,0,.82);
      border-radius: 10px;
      padding: 7px 8px;
      font-weight:900;
      cursor:pointer;
      font-size: 11px;
      line-height:1;
      flex: 0 0 auto;
    }
    .tbtn.primary{
      background: rgba(57,158,146,.16);
      border-color: rgba(57,158,146,.35);
    }
    .tbtn:active{ transform: translateY(1px); }

    @media (min-width: 521px){
      :root{ --footerH: 64px; }
      .footer-inner{ flex-direction: row; }
      .footer-bottom{ justify-content:flex-end; }
      .time-controls{ flex-wrap: nowrap; }
    }

    @media (max-width: 520px){
      :root{ --footerH: 132px; }

      .subbar{
        gap: 6px;
        padding: 7px 10px;
      }
      .subbar .left{
        gap: 5px;
      }
      .pill{
        gap: 4px;
        padding: 5px 7px;
        font-size: 10px;
        max-width: 48vw;
      }

      .footer-inner{
        flex-direction: column;
        align-items: stretch;
        justify-content:flex-start;
        gap: 8px;
      }
      .footer-top{
        width: 100%;
        min-width: 0;
        gap: 8px;
        align-items: center;
        flex-direction: row;
        justify-content: space-between;
      }
      .footer-bottom{
        width: 100%;
        justify-content:flex-start;
        gap: 0;
      }
      .timebox{
        min-width: 0;
        flex: 0 1 auto;
      }
      .timebox .label{
        font-size: 10px;
      }
      .timebox .value{
        font-size: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #btnNow{
        flex: 0 0 auto;
        width: 136px;
        margin-left: auto;
        padding: 9px 8px;
        font-size: 10px;
      }
      .time-controls{
        width: 100%;
        display: grid;
        grid-template-columns: repeat(8, minmax(0, 1fr));
        gap: 2px;
        overflow: hidden;
      }
      .tbtn{
        width: 100%;
        min-width: 0;
        padding: 8px 0;
        font-size: 10px;
        line-height: 1;
        border-radius: 9px;
        text-align: center;
        white-space: nowrap;
      }
    }

    @media (max-width: 390px){
      :root{ --footerH: 126px; }

      .subbar{
        gap: 4px;
        padding: 6px 8px;
      }
      .pill{
        padding: 4px 6px;
        font-size: 9px;
        max-width: 42vw;
      }

      .footer-inner{
        padding: 6px 8px;
        gap: 6px;
      }
      .footer-top{
        gap: 6px;
      }
      .timebox .label{
        font-size: 9px;
      }
      .timebox .value{
        font-size: 9px;
      }
      #btnNow{
        width: 112px;
        padding: 8px 6px;
        font-size: 9px;
      }
      .time-controls{
        gap: 1px;
      }
      .tbtn{
        padding: 7px 0;
        font-size: 9px;
      }
    }

    /* ===== モーダル共通 ===== */
    .modal-backdrop{
      position:fixed;
      inset:0;
      background: rgba(0,0,0,.45);
      display:none;
      z-index:80;
    }
    .modal{
      position:fixed;
      inset:0;
      display:none;
      z-index:90;
      align-items:center;
      justify-content:center;
      padding: 16px;
    }
    .modal.show{ display:flex; }
    .modal-backdrop.show{ display:block; }

    .modal-card{
      width: min(820px, 100%);
      max-height: min(82svh, 860px);
      overflow:auto;
      border-radius: 14px;
      background:#fff;
      border: 1px solid rgba(0,0,0,.12);
      box-shadow: 0 24px 70px rgba(0,0,0,.30);
    }
    @media (min-width: 641px){
      .modal-card{
        scrollbar-width: thin;
        scrollbar-color: rgba(20,68,121,.22) transparent;
      }
      .modal-card::-webkit-scrollbar{
        width: 8px;
      }
      .modal-card::-webkit-scrollbar-track{
        background: transparent;
      }
      .modal-card::-webkit-scrollbar-thumb{
        background: rgba(20,68,121,.18);
        border-radius: 999px;
        border: 2px solid transparent;
        background-clip: padding-box;
      }
      .modal-card::-webkit-scrollbar-thumb:hover{
        background: rgba(20,68,121,.28);
        background-clip: padding-box;
      }
    }
    @media (max-width: 640px){
      .modal-card{
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .modal-card::-webkit-scrollbar{
        display: none;
      }
    }
    .modal-head{
      position:sticky;
      top:0;
      z-index:2;
      background:#fff;
      border-bottom: 1px solid var(--divider);
      padding: 10px 12px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

  <script>
    // ===== 曜日別CSV（例）=====
    const CSV_BY_DAY = {
      mon_thu:     { up: "honsen_nobori.csv", down: "honsen_kudari.csv" },
      friday:      { up: "honsen_fri_nobori.csv", down: "honsen_fri_kudari.csv" },
      sat_holiday: { up: "honsen_holi_nobori.csv", down: "honsen_holi_kudari.csv" },
    };

    function formatDateKey(date){
      return `${date.getFullYear()}-${pad2(date.getMonth()+1)}-${pad2(date.getDate())}`;
    }

    function addDays(date, days){
      const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      d.setDate(d.getDate() + days);
      return d;
    }

    function sameDate(a, b){
      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();
    }

    function nthMonday(year, monthIndex, nth){
      const d = new Date(year, monthIndex, 1);
      const offset = (8 - d.getDay()) % 7;
      return 1 + offset + (nth - 1) * 7;
    }

    function vernalEquinoxDay(year){
      return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }

    function autumnEquinoxDay(year){
      return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
    }

    function baseJapaneseHolidayName(date){
      const year = date.getFullYear();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      if(month === 1 && day === 1) return "元日";
      if(month === 1 && day === nthMonday(year, 0, 2)) return "成人の日";
      if(month === 2 && day === 11) return "建国記念の日";
      if(month === 2 && day === 23) return "天皇誕生日";
      if(month === 3 && day === vernalEquinoxDay(year)) return "春分の日";
      if(month === 4 && day === 29) return "昭和の日";
      if(month === 5 && day === 3) return "憲法記念日";
      if(month === 5 && day === 4) return "みどりの日";
      if(month === 5 && day === 5) return "こどもの日";
      if(month === 7 && day === nthMonday(year, 6, 3)) return "海の日";
      if(month === 8 && day === 11) return "山の日";
      if(month === 9 && day === nthMonday(year, 8, 3)) return "敬老の日";
      if(month === 9 && day === autumnEquinoxDay(year)) return "秋分の日";
      if(month === 10 && day === nthMonday(year, 9, 2)) return "スポーツの日";
      if(month === 11 && day === 3) return "文化の日";
      if(month === 11 && day === 23) return "勤労感謝の日";
      return "";
    }

    function isJapaneseHolidayCore(date){
      if(baseJapaneseHolidayName(date)) return true;
      for(let back=1; back<=7; back++){
        const prev = addDays(date, -back);
        if(!baseJapaneseHolidayName(prev)) continue;
        if(prev.getDay() !== 0) continue;
        let substitute = addDays(prev, 1);
        while(baseJapaneseHolidayName(substitute)){
          substitute = addDays(substitute, 1);
        }
        return sameDate(substitute, date);
      }
      return false;
    }

    function isJapaneseHoliday(date){
      if(isJapaneseHolidayCore(date)) return true;
      const dow = date.getDay();
      if(dow === 0 || dow === 6) return false;
      return isJapaneseHolidayCore(addDays(date, -1)) && isJapaneseHolidayCore(addDays(date, 1));
    }

    function getOperationalDate(date){
      const d = new Date(date.getTime());
      if(d.getHours() < 4){
        d.setDate(d.getDate() - 1);
      }
      return d;
    }

    function getDayKey(date){
      const opDate = getOperationalDate(date);
      const dow = opDate.getDay(); // 0=日, 6=土
      if(dow === 0 || dow === 6) return "sat_holiday";
      if(isJapaneseHoliday(opDate)) return "sat_holiday";
      if(dow === 5) return "friday";
      return "mon_thu";
    }

    let LINE_COLOR = "#399E92";
    let IA_LINE_COLOR = "#CDB55E";
    let TR_LINE_COLOR = "#369944";
    let YK_LINE_COLOR = "#9F3347";
    let EXTRA_LINE_COLORS = [
      { prefix: "TR", color: TR_LINE_COLOR },

    ];
    const IA_BRANCH_CONFIG = {
      anchorCode: "N03",

        { code: "IA01", name: "岩国空港", dx: 212, mirrorCode: "N01", dy: 156 },
      ],
    };
    let IA_BRANCH_STATION_NAMES = new Set(IA_BRANCH_CONFIG.stations.map(st => st.name));
    let IA_BRANCH_FALLBACK_TRAVEL_SEC = 180;

    // ===== 新CSV列定義（駅番号列が増えた版）=====
    const COL_STNO  = 0;  // 駅番号 (N01など)
    const COL_LABEL = 1;  // 行ラベル or 駅名
    const COL_KIND  = 2;  // 着/発/番線
    const FIRST_TRAIN_COL = 3; // 列車データ開始列

    // ===== 他路線リンク（必要に応じてURLを書き換えてください） =====
    const ROUTE_LINKS = [
      { label: "架鉄本線", href: "../mainline/index.html" },

      { label: "架鉄街道鉄道線",   href: "#" },
      { label: "架鉄サイトトップページ", href: "#" },
    ];

    // ===== 種別色 =====
    const DEFAULT_TYPE_COLOR = {
      "特急": "#164190",
      "空特": "#47BCB9",
      "空快": "#3695D4",
      "空Ｐ": "#CA175E",

    };
    const TYPE_COLOR = {...DEFAULT_TYPE_COLOR};

    function typeColor(type){
      const t = (type || "").trim();
      return TYPE_COLOR[t] || LINE_COLOR;
    }

    function idealTextColor(hex){
      const h = (hex || "").replace("#","");
      if(h.length !== 6) return "#fff";
      const r = parseInt(h.slice(0,2),16);
      const g = parseInt(h.slice(2,4),16);
      const b = parseInt(h.slice(4,6),16);
      const y = (r*299 + g*587 + b*114)/1000;
      return (y >= 160) ? "#000" : "#fff";
    }

    // =========================================================
    // 駅時刻表：行先頭文字
    // =========================================================
    const DEFAULT_DEST_INITIALS = {
      "新糸崎": "新糸",
      "広島空港": "広空",
      "新本郷": "本郷",
      "船木": "船木",

      "佐伯中央": "佐中",

      "灘急川尻": "灘尻",
    };
    const DEST_INITIALS = {...DEFAULT_DEST_INITIALS};
    function getDestInitial(destName){
      const s = String(destName ?? "").trim();
      if(!s) return "";
      if(DEST_INITIALS[s]) return DEST_INITIALS[s];
      return s.slice(0,1);
    }

    // ===== 設定（localStorage） =====
    const SITE_CONFIG_CSV = "view_select.csv";
    const DEFAULT_SITE_CONFIG = {
      config_mode: "basic",
      line_name: "架鉄本線",
      line_short_name: "本線",
      operator_name: "架空の鉄道",
      train_position_page_name: "列車走行位置",
      diagram_page_name: "ﾀﾞｲﾔｸﾞﾗﾑ",
      route_timetable_page_name: "路線時刻表",
      route_links_visible: "false",
      route_links_group_name: "その他の路線",
      route_link_1_label: "架鉄支線１",
      route_link_1_href: "../shisen1/index.html",
      route_link_2_label: "架鉄港線",
      route_link_2_href: "#",
      route_link_3_label: "架鉄空港アクセス線",
      route_link_3_href: "../ialine/index.html",
      route_link_4_label: "新架鉄ライン",
      route_link_4_href: "#",
      route_link_5_label: "架鉄街道鉄道線",
      route_link_5_href: "#",
      route_link_6_label: "架鉄サイトトップページ",

    };
    let siteConfig = {...DEFAULT_SITE_CONFIG};
    const SIMPLE_CONFIG_KEYS = new Set([
      "config_mode",
    ]);
    const LS_KEY_LABEL_MODE = "nakyu_label_mode"; // "always" | "toggle"
    const LS_KEY_DISPLAY_TIME_VISIBILITY = "nakyu_display_time_visibility"; // "show" | "hide"
    const LS_KEY_SHOW_PASS_STOPS = "nakyu_show_pass_stops"; // "show" | "hide"

    const LS_KEY_LAST_TRAIN_START_HOUR = "nakyu_last_train_start_hour"; // "12".."23"
    function loadLabelMode(){
      const v = localStorage.getItem(LS_KEY_LABEL_MODE);
      if(v === "toggle" || v === "always") return v;
      if(window.matchMedia && window.matchMedia("(max-width: 640px)").matches) return "toggle";
      return "always";
    }

    }

    let labelMode = loadLabelMode();

    const stopStackMap = new Map();
    const labelOpenMap = new Map();

    let displayOffsetSec = 0;

    const pad2 = (n) => String(n).padStart(2, "0");
    function formatNow(d){
      return `${d.getFullYear()}/${pad2(d.getMonth()+1)}/${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}:${pad2(d.getSeconds())}`;
    }
    function secToHHMM(sec){
      if(sec == null) return "";
      const DAY = 86400;
      sec = Math.max(0, Math.floor(sec));
      sec = ((sec % DAY) + DAY) % DAY;
      const hh = Math.floor(sec / 3600);
      const mm = Math.floor((sec % 3600) / 60);
      return `${pad2(hh)}:${pad2(mm)}`;
    }

    function parseTimeField(v){
  if(v == null) return {sec:null, isPass:false, isNoService:false};
  let s = String(v).trim();
  if(!s) return {sec:null, isPass:false, isNoService:false};

  // || は「その駅を通らない」
  if(s === "||") return {sec:null, isPass:false, isNoService:true};

  const isPass = s.endsWith("?");
  s = s.replace(/\?/g, "").replace(/\s+/g, "");

  if(!/^\d+$/.test(s)) return {sec:null, isPass, isNoService:false};

  // 1〜6桁は常に HHMMSS（左ゼロ埋め）
  if(s.length > 6) s = s.slice(-6);
  s = s.padStart(6, "0");

  const hh = Number(s.slice(0,2));
  const mm = Number(s.slice(2,4));
  const ss = Number(s.slice(4,6));
  if([hh,mm,ss].some(Number.isNaN)) return {sec:null, isPass, isNoService:false};

  return {sec: hh*3600 + mm*60 + ss, isPass, isNoService:false};
}

    function parseCSV(text){
      const rows = [];
      let row = [], cur = "", inQuotes = false;
      for(let i=0;i<text.length;i++){
        const ch = text[i], next = text[i+1];
        if(inQuotes){
          if(ch === '"' && next === '"'){ cur += '"'; i++; }
          else if(ch === '"'){ inQuotes = false; }
          else cur += ch;
          continue;
        }
        if(ch === '"') inQuotes = true;
        else if(ch === ","){ row.push(cur); cur = ""; }
        else if(ch === "\r"){ }
        else if(ch === "\n"){ row.push(cur); rows.push(row); row = []; cur = ""; }
        else cur += ch;
      }
      if(cur.length || row.length){ row.push(cur); rows.push(row); }
      return rows;
    }

    function uniqPreserve(arr){
      const seen = new Set(), out = [];
      for(const x of arr){ if(!seen.has(x)){ seen.add(x); out.push(x); } }
      return out;
    }

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function normalizeMidnight(train){
      const DAY = 86400;
      const ordered = [...train.stops].sort((a,b)=>{
        return (train.dir === "up") ? (a.stationIdx - b.stationIdx) : (b.stationIdx - a.stationIdx);
      });

      let dayOffset = 0;
      let lastAbs = null;

      for(const s of ordered){
        const any = (s.arrSec ?? s.depSec ?? s.passSec);
        if(any == null) continue;

        if(s.arrSec != null){
          let abs = s.arrSec + dayOffset*DAY;
          while(lastAbs != null && abs + 2 < lastAbs){ dayOffset++; abs = s.arrSec + dayOffset*DAY; }
          s.arrAbs = abs; lastAbs = abs;
        }
        if(s.depSec != null){
          let abs = s.depSec + dayOffset*DAY;
          while(lastAbs != null && abs + 2 < lastAbs){ dayOffset++; abs = s.depSec + dayOffset*DAY; }
          s.depAbs = abs; lastAbs = abs;
        }
        if(s.passSec != null){
          let abs = s.passSec + dayOffset*DAY;
          while(lastAbs != null && abs + 2 < lastAbs){ dayOffset++; abs = s.passSec + dayOffset*DAY; }
          s.passAbs = abs; lastAbs = abs;
        }
      }

      train.stops.sort((a,b)=>{
        const ta = (a.depAbs ?? a.arrAbs ?? a.passAbs ?? 1e18);
        const tb = (b.depAbs ?? b.arrAbs ?? b.passAbs ?? 1e18);
        return ta - tb;
      });

      train.segments = [];
      for(let i=0;i<train.stops.length-1;i++){
        const A = train.stops[i];
        const B = train.stops[i+1];
        const t0 = (A.depAbs ?? A.arrAbs ?? A.passAbs);
        const t1 = (B.arrAbs ?? B.depAbs ?? B.passAbs);
        if(t0 == null || t1 == null) continue;
        if(t1 <= t0) continue;
        train.segments.push({ fromIdx: A.stationIdx, toIdx: B.stationIdx, t0, t1 });
      }

      train.firstAbs = (train.stops[0]?.depAbs ?? train.stops[0]?.arrAbs ?? train.stops[0]?.passAbs ?? null);
      const last = train.stops[train.stops.length-1];
      train.lastAbs = (last?.arrAbs ?? last?.depAbs ?? last?.passAbs ?? null);

      // Entire trains that live in the 0:00-2:59 window belong to the previous operational day.
      if(train.firstAbs != null && train.lastAbs != null && train.lastAbs < 10800){
        for(const s of train.stops){
          if(s.arrAbs != null) s.arrAbs += DAY;
          if(s.depAbs != null) s.depAbs += DAY;
          if(s.passAbs != null) s.passAbs += DAY;
        }
        train.firstAbs += DAY;
        train.lastAbs += DAY;
      }
    }

    // ★追加：serviceStart/serviceEnd（秒）を abs に揃える
    function alignAbsAroundRef(sec, refAbs){
      if(sec == null || refAbs == null) return null;
      const DAY = 86400;
      let abs = sec;
      // refAbs の近く（±12時間以内）になるように DAY を足し引き
      while(abs - refAbs > 43200) abs -= DAY;
      while(refAbs - abs > 43200) abs += DAY;
      return abs;
    }

    // ★新CSV：駅リスト抽出（col0=駅番号, col1=駅名, col2=着発番線）
    function extractStationsFromUpCsv(csvText){
      const rows = parseCSV(csvText).map(r => r.map(c => (c ?? "").trim()));

      const startName = configText("station_start_name").trim() || "海土路";
      const isMainStationRow = (r) => {
        const code = (r[COL_STNO] ?? "").trim();
        const name = (r[COL_LABEL] ?? "").trim();
        const kind = (r[COL_KIND] ?? "").trim();
        return !!name
          && !( /^IA\d+/i.test(code) || IA_BRANCH_STATION_NAMES.has(name) )
          && (kind === "着" || kind === "発" || kind === "番線");
      };
      let startRow = rows.findIndex(r => (r[COL_LABEL] ?? "").trim() === startName && isMainStationRow(r));
      if(startRow < 0) startRow = rows.findIndex(isMainStationRow);
      if(startRow < 0) throw new Error("駅リストを抽出できる行が見つかりません（上りCSV）");

      const list = [];
      for(let i=startRow;i<rows.length;i++){
        const code = (rows[i][COL_STNO] ?? "").trim();
        const name = (rows[i][COL_LABEL] ?? "").trim();
        const kind = (rows[i][COL_KIND] ?? "").trim();
        if(!name) continue;
        if(/^IA\d+/i.test(code) || IA_BRANCH_STATION_NAMES.has(name)) continue;

        // 駅セクションは「着/発/番線」のいずれかがある行として拾う
        if(!(kind === "着" || kind === "発" || kind === "番線")) continue;

        list.push({ code, name });
      }

      const seen = new Set();
      const out = [];
      for(const x of list){
        if(seen.has(x.name)) continue;
        seen.add(x.name);
        out.push(x);
      }

      return out.map((st, i) => ({
        idx: i,
        code: st.code || `${String(i+1).padStart(2,"0")}`,
        name: st.name
      }));
    }

    function buildDisplayStationDefs(rows, refStations){
      const refMap = new Map(refStations.map(st => [st.name, st]));
      const defs = [];
      const defMap = new Map();

      for(let i=0;i<rows.length;i++){
        const code = (rows[i][COL_STNO] ?? "").trim();
        const name = (rows[i][COL_LABEL] ?? "").trim();
        const kind = (rows[i][COL_KIND] ?? "").trim();
        if(!name) continue;
        if(!(kind === "着" || kind === "発" || kind === "番線")) continue;

        let def = defMap.get(name);
        if(!def){
          const ref = refMap.get(name) || null;
          def = {
            code: code || ref?.code || "",
            name,
            stationIdx: ref?.idx ?? null,
            arrRows: [],
            depRows: [],
            trackRows: [],
          };
          defMap.set(name, def);
          defs.push(def);
        }else if(code && !def.code){
          def.code = code;
        }

        if(kind === "着") def.arrRows.push(i);
        if(kind === "発") def.depRows.push(i);
        if(kind === "番線") def.trackRows.push(i);
      }

      return defs;
    }

    function pickFirstTimeField(rows, rowIndexes, col){
      for(const rowIdx of (rowIndexes || [])){
        const parsed = parseTimeField(rows[rowIdx]?.[col] ?? "");
        if(parsed.sec != null || parsed.isPass){
          return parsed;
        }
      }
      return {sec:null, isPass:false, isNoService:false};
    }

    function pickFirstTrackValue(rows, rowIndexes, col){
      for(const rowIdx of (rowIndexes || [])){
        const v = String(rows[rowIdx]?.[col] ?? "").trim();
        if(v && v !== "||") return v;
      }
      return "";
    }

    function buildStopsFromDefs(rows, col, defs){
      const stops = [];

      for(const st of defs){
        const arr = pickFirstTimeField(rows, st.arrRows, col);
        const dep = pickFirstTimeField(rows, st.depRows, col);
        if(arr.sec == null && dep.sec == null) continue;

        let arrSec = arr.sec;
        let depSec = dep.sec;
        let passSec = null;

        if(arr.isPass || dep.isPass){
          passSec = (arr.sec ?? dep.sec);
          arrSec = null;
          depSec = null;
        }

        stops.push({
          stationIdx: Number.isFinite(st.stationIdx) ? st.stationIdx : null,
          stationName: st.name,
          code: st.code,
          track: pickFirstTrackValue(rows, st.trackRows, col),
          arrSec, depSec, passSec,
          arrAbs:null, depAbs:null, passAbs:null,
        });
      }

      return stops;
    }

    function normalizeStopsByOrder(stops, refAbs = null){
      if(refAbs != null){
        for(const s of stops){
          s.arrAbs = (s.arrSec != null) ? alignAbsAroundRef(s.arrSec, refAbs) : null;
          s.depAbs = (s.depSec != null) ? alignAbsAroundRef(s.depSec, refAbs) : null;
          s.passAbs = (s.passSec != null) ? alignAbsAroundRef(s.passSec, refAbs) : null;
        }

        stops.sort((a,b)=>{
          const ta = (a.depAbs ?? a.arrAbs ?? a.passAbs ?? 1e18);
          const tb = (b.depAbs ?? b.arrAbs ?? b.passAbs ?? 1e18);
          return ta - tb;
        });
        return;
      }

      const DAY = 86400;
      let dayOffset = 0;
      let lastAbs = null;

      for(const s of stops){
        const any = (s.arrSec ?? s.depSec ?? s.passSec);
        if(any == null) continue;

        if(s.arrSec != null){
          let abs = s.arrSec + dayOffset * DAY;
          while(lastAbs != null && abs + 2 < lastAbs){ dayOffset++; abs = s.arrSec + dayOffset * DAY; }
          s.arrAbs = abs;
          lastAbs = abs;
        }
        if(s.depSec != null){
          let abs = s.depSec + dayOffset * DAY;
          while(lastAbs != null && abs + 2 < lastAbs){ dayOffset++; abs = s.depSec + dayOffset * DAY; }
          s.depAbs = abs;
          lastAbs = abs;
        }
        if(s.passSec != null){
          let abs = s.passSec + dayOffset * DAY;
          while(lastAbs != null && abs + 2 < lastAbs){ dayOffset++; abs = s.passSec + dayOffset * DAY; }
          s.passAbs = abs;
          lastAbs = abs;
        }
      }

      stops.sort((a,b)=>{
        const ta = (a.depAbs ?? a.arrAbs ?? a.passAbs ?? 1e18);
        const tb = (b.depAbs ?? b.arrAbs ?? b.passAbs ?? 1e18);
        return ta - tb;
      });
    }

    // ★新CSV：ヘッダ行index固定
    const ROW_REMARK = 1;   // 2行目 備考
    const ROW_CARS   = 3;   // 4行目 両数
    const ROW_TRAINNO= 4;   // 5行目 列車番号
    const ROW_TYPE   = 6;   // 7行目 列車種別
    const ROW_NAME   = 7;   // 8行目 列車名
    const ROW_GOSU   = 8;   // 9行目 号数(数字)
    const ROW_GO     = 9;   // 10行目 "号"
    const ROW_ORIGIN = 10;  // 11行目 始発駅
    const ROW_START  = 12;  // 13行目 始発駅に到着する時間（あれば発車前表示）
    const ROW_DEST   = 14;  // 15行目 終着駅
    const ROW_END    = 16;  // 17行目 終着駅を去る時間（あれば延長表示）

    function parseScheduleWithRefStations(csvText, dir, sourceName, refStations){
      const rows = parseCSV(csvText).map(r => r.map(c => (c ?? "").trim()));
      const displayStationDefs = buildDisplayStationDefs(rows, refStations);

      // 駅名→（着/発/番線）行index
      const stationRowMap = new Map();
      for(const st of refStations){
        stationRowMap.set(st.name, {arrRows:[], depRows:[], trackRows:[]});
      }

      for(let i=0;i<rows.length;i++){
        const stName = (rows[i][COL_LABEL] ?? "").trim();
        const kind   = (rows[i][COL_KIND] ?? "").trim();
        if(!stName || !stationRowMap.has(stName)) continue;

        const obj = stationRowMap.get(stName);
        if(kind === "着") obj.arrRows.push(i);
        if(kind === "発") obj.depRows.push(i);
        if(kind === "番線") obj.trackRows.push(i);
      }

      const maxCols = Math.max(...rows.map(r => r.length));
      const trainCols = [];
      for(let c=FIRST_TRAIN_COL;c<maxCols;c++){
        const no = (rows[ROW_TRAINNO]?.[c] ?? "").trim();
        if(no) trainCols.push(c);
      }

      const trains = [];
      for(const c of trainCols){
        const rawNo = (rows[ROW_TRAINNO]?.[c] ?? "").trim();
        const trainNo = rawNo;
        const trainId = `${sourceName}:${dir}:col${c}:${rawNo || "NONO"}`;

        const type = (rows[ROW_TYPE]?.[c] ?? "").trim();
        const tname = (rows[ROW_NAME]?.[c] ?? "").trim();

        const dest = (rows[ROW_DEST]?.[c] ?? "").trim();
        const origin = (rows[ROW_ORIGIN]?.[c] ?? "").trim();

        const cars = (rows[ROW_CARS]?.[c] ?? "").trim();
        const zPart = (rows[ROW_GOSU]?.[c] ?? "").trim();   // 数字
        const yPart = (rows[ROW_GO]?.[c] ?? "").trim();     // "号"
        const remark = (rows[ROW_REMARK]?.[c] ?? "").trim();

        const startSec = parseTimeField(rows[ROW_START]?.[c] ?? "").sec; // あれば使う
        const endSec   = parseTimeField(rows[ROW_END]?.[c] ?? "").sec;   // あれば使う

        const stops = buildStopsFromDefs(rows, c, refStations.map(st => {
          const map = stationRowMap.get(st.name) || {};
          return {
            code: st.code,
            name: st.name,
            stationIdx: st.idx,
            arrRows: map.arrRows ?? [],
            depRows: map.depRows ?? [],
            trackRows: map.trackRows ?? [],
          };
        }));
        const displayStops = buildStopsFromDefs(rows, c, displayStationDefs);

        const train = {
          dir,
          trainId,
          trainNo,
          type,
          name: tname || "",
          dest,
          origin,
          cars,
          zPart,
          yPart,
          remark,
          // ★追加：サービス開始/終了（13/17行目）
          serviceStartSec: startSec ?? null,
          serviceEndSec: endSec ?? null,
          serviceStartAbs: null,
          serviceEndAbs: null,
          serviceStartStationIdx: null, // 始発駅のidx（見つかれば）
          serviceEndStationIdx: null,   // 終着駅のidx（見つかれば）
          stops,
          displayStops,
          segments: [],
          firstAbs: null,
          lastAbs: null,
        };

        normalizeMidnight(train);
        normalizeStopsByOrder(train.displayStops, train.firstAbs);

        // ★始発駅/終着駅のidx（駅名から推定）
        if(train.origin){
          const st = refStations.find(s => s.name === train.origin);
          if(st) train.serviceStartStationIdx = st.idx;
        }
        if(train.dest){
          const st = refStations.find(s => s.name === train.dest);
          if(st) train.serviceEndStationIdx = st.idx;
        }

        // ★13行目の時刻がある場合：firstAbs の近くに揃えて abs 化
        if(train.serviceStartSec != null && train.firstAbs != null){
          train.serviceStartAbs = alignAbsAroundRef(train.serviceStartSec, train.firstAbs);
        }
        // ★17行目の時刻がある場合：lastAbs の近くに揃えて abs 化
        if(train.serviceEndSec != null && train.lastAbs != null){
          train.serviceEndAbs = alignAbsAroundRef(train.serviceEndSec, train.lastAbs);
        }

        trains.push(train);
      }

      return { direction: dir, stations: refStations, trains };
    }

    function computeCutoverSec(...schedules){
      let maxAfterMidnight = 0;
      const DAY = 86400;

      for(const sch of schedules){
        if(!sch?.trains) continue;
        for(const t of sch.trains){
          for(const s of t.stops){
            const list = [s.arrAbs, s.depAbs, s.passAbs].filter(v => v != null);
            for(const abs of list){
              if(abs >= DAY){
                maxAfterMidnight = Math.max(maxAfterMidnight, abs - DAY);
              }
            }
          }
        }
      }
      return Math.max(0, Math.floor(maxAfterMidnight));
    }

    let STATION_COUNT = 39;

    // ★拡張：13行目(serviceStartAbs)がある間は「始発駅に停車中」扱いで表示
    function calcTrainPosition(train, nowAbs){
      // 1) 駅で停車中（arrAbs〜depAbs / 発のみ駅は depAbs の20秒前〜depAbs）
      for(const s of train.stops){
        if(s.arrAbs != null && s.depAbs != null){
          if(nowAbs >= s.arrAbs && nowAbs < s.depAbs){
            return { status:"stopped", y01: s.stationIdx / (STATION_COUNT-1), atStationIdx: s.stationIdx };
          }
        }
        if(s.arrAbs == null && s.depAbs != null){
          const stopStart = s.depAbs - 20;
          if(nowAbs >= stopStart && nowAbs <= s.depAbs){
            return { status:"stopped", y01: s.stationIdx / (STATION_COUNT-1), atStationIdx: s.stationIdx };
          }
        }
      }

      // 2) 発車前のサービス開始（13行目）〜 firstAbs の間：始発駅にいる扱い（あれば）
      if(train.serviceStartAbs != null && train.firstAbs != null && nowAbs >= train.serviceStartAbs && nowAbs < train.firstAbs){
        if(Number.isFinite(train.serviceStartStationIdx)){
          return { status:"stopped", y01: train.serviceStartStationIdx / (STATION_COUNT-1), atStationIdx: train.serviceStartStationIdx };
        }
      }

      // 3) サービス終了延長（17行目）で lastAbs 以降も終着駅にいる扱い（あれば）
      if(train.serviceEndAbs != null && train.lastAbs != null && nowAbs > train.lastAbs && nowAbs <= train.serviceEndAbs){
        if(Number.isFinite(train.serviceEndStationIdx)){
          return { status:"stopped", y01: train.serviceEndStationIdx / (STATION_COUNT-1), atStationIdx: train.serviceEndStationIdx };
        }
        return { status:"not_in_service", y01: null };
      }

      // 4) 通常の運行範囲外
      if(train.firstAbs == null || train.lastAbs == null) return { status:"not_in_service", y01: null };

      // ★サービス開始/終了があればそれを優先して範囲判定（空欄なら従来どおり）
      const inStart = (train.serviceStartAbs != null) ? train.serviceStartAbs : train.firstAbs;
      const inEnd   = (train.serviceEndAbs != null) ? train.serviceEndAbs : train.lastAbs;

      if(nowAbs < inStart || nowAbs > inEnd) return { status:"not_in_service", y01: null };
      if(train.lastAbs != null && nowAbs > train.lastAbs && !Number.isFinite(train.serviceEndStationIdx)){
        return { status:"not_in_service", y01: null };
      }

      // 5) 走行中（segments）
      for(const seg of train.segments){
        if(nowAbs >= seg.t0 && nowAbs < seg.t1){
          const frac = (nowAbs - seg.t0) / (seg.t1 - seg.t0);
          const posIdx = seg.fromIdx + (seg.toIdx - seg.fromIdx) * frac;
          return { status:"running", y01: posIdx / (STATION_COUNT-1) };
        }
      }

      // 6) フォールバック：最寄り停車点
      let best = null;
      for(const s of train.stops){
        const t = (s.depAbs ?? s.arrAbs ?? s.passAbs);
        if(t == null) continue;
        const d = Math.abs(nowAbs - t);
        if(best == null || d < best.d) best = {d, s};
      }
      if(best) return { status:"running", y01: best.s.stationIdx / (STATION_COUNT-1) };
      return { status:"not_in_service", y01: null };
    }

    function readBranchStationsFromConfig(){
      const stations = [];
      const fallbackByIndex = new Map(
        IA_BRANCH_CONFIG.stations.map((st, idx) => [idx + 1, st])
      );
      for(let i=1;i<=20;i++){
        const fallback = fallbackByIndex.get(i) || null;
        const code = configText(`branch_station_${i}_code`).trim() || fallback?.code || "";
        const name = configText(`branch_station_${i}_name`).trim() || fallback?.name || "";
        const mirrorCode = configText(`branch_station_${i}_mirror_code`).trim() || fallback?.mirrorCode || "";
        if(!code && !name) continue;
        stations.push({
          code,
          name,
          dx: configNumber(`branch_station_${i}_dx`, fallback?.dx ?? 0),
          mirrorCode,
          dy: configNumber(`branch_station_${i}_dy`, fallback?.dy ?? 0),
        });
      }
      return stations;

        const rows = parseCSV(await r.text());
        const next = {...DEFAULT_SITE_CONFIG};
        for(const row of rows){
          const key = String(row[0] ?? "").replace(/^\uFEFF/, "").trim();
          if(!key || key === "key" || key.startsWith("#")) continue;
          next[key] = String(row[1] ?? "").trim();
        }
        siteConfig = next;
      }

        siteConfig = {...DEFAULT_SITE_CONFIG};
      }

    function getTrainTerminalAbs(train){
      if(!train) return null;

      if(train.serviceEndAbs != null) return train.serviceEndAbs;
      if(train.serviceEndSec != null && train.lastAbs != null){
        return alignAbsAroundRef(train.serviceEndSec, train.lastAbs);
      }
      return train.lastAbs ?? null;
    }

    function computeLastTrainIdsByDestination(...schedules){
      const trainsByDest = new Map();
      const thresholdSec = lastTrainStartHour * 3600;

      for(const sch of schedules){
        for(const train of (sch?.trains || [])){
          const dest = trainDestFallback(train).trim();
          if(!dest) continue;
          const dirKey = String(train.dir ?? "").trim();
          const key = `${dirKey}:${dest}`;

          const serviceEnd = getTrainTerminalAbs(train);
          if(serviceEnd == null) continue;
          const originDepartAbs = train.firstAbs ?? null;
          if(lastTrainMode === "after_origin_hour"){
            if(originDepartAbs == null) continue;
            const originDepartSec = ((originDepartAbs % 86400) + 86400) % 86400;
            if(originDepartSec < thresholdSec) continue;
          }

          if(!trainsByDest.has(key)) trainsByDest.set(key, []);
          trainsByDest.get(key).push({
            trainId: train.trainId,
            serviceEnd,
            departBase: originDepartAbs ?? -1,
          });
        }
      }

      const out = new Set();

      for(const arr of trainsByDest.values()){
        arr.sort((a,b)=> (a.serviceEnd - b.serviceEnd) || (a.departBase - b.departBase));
        const last = arr[arr.length - 1];
        if(last) out.add(last.trainId);
      }

      return out;
    }

      const reversed = [...stations].reverse();
      const html = [];
      for(const st of reversed){
        html.push(`
          <div class="station-row" data-stidx="${st.idx}">
            <div class="st-left">
              <button class="depbtn" type="button" data-role="depBoardBtn" title="発車標">
                <span class="screen" aria-hidden="true"></span>
              </button>
              <div class="st-main">
                <div class="st-code">${escapeHtml(st.code)}</div>
                <button class="st-namebtn" type="button" data-role="stationName" title="${escapeHtml(st.name)}">${escapeHtml(st.name)}</button>
                <div class="st-sub"> </div>
              </div>
            </div>
            <div class="st-right"></div>
          </div>
        `);
      }
      stationsEl.innerHTML = html.join("");

      stationsEl.querySelectorAll('[data-role="stationName"]').forEach(btn=>{
        btn.addEventListener("click", (e)=>{
          const row = e.target.closest(".station-row");
          const idx = Number(row?.dataset?.stidx);
          if(Number.isFinite(idx)) openStationTimetable(idx);
        });
      });
      stationsEl.querySelectorAll('[data-role="depBoardBtn"]').forEach(btn=>{
        btn.addEventListener("click", (e)=>{
          e.stopPropagation();
          const row = e.target.closest(".station-row");
          const idx = Number(row?.dataset?.stidx);
          if(Number.isFinite(idx)) openDepartureBoard(idx);
        });
      });

      lineWrap.querySelectorAll(".node").forEach(n => n.remove());
      lineWrap.querySelectorAll(".branch-layer").forEach(n => n.remove());
      lineWrap.querySelectorAll(".branch-ui-layer").forEach(n => n.remove());
      const rows = lineWrap.querySelectorAll(".station-row");
      for(const row of rows){
        const idx = Number(row.dataset.stidx);
        const node = document.createElement("div");
        node.className = "node";
        node.style.top = (row.offsetTop + row.offsetHeight/2) + "px";
        node.dataset.stidx = idx;
        lineWrap.appendChild(node);
      }

      buildIaBranchUI(stations);
    }

    function findTrainById(trainId){
      return scheduleUp?.trains?.find(t => t.trainId === trainId)
        ?? scheduleDown?.trains?.find(t => t.trainId === trainId)
        ?? null;
    }

    function scrollToCenterInContainer(container, target){
      if(!container || !target) return;
      const cRect = container.getBoundingClientRect();
      const tRect = target.getBoundingClientRect();
      const current = container.scrollTop;
      const delta = (tRect.top - cRect.top) + current;
      const desired = delta - (container.clientHeight/2) + (target.clientHeight/2);
      container.scrollTop = Math.max(0, desired);
    }

    function buildBranchSegmentHtml(x1, y1, x2, y2, color){
      const dx = x2 - x1;
      const dy = y2 - y1;
      const len = Math.hypot(dx, dy);
      const deg = Math.atan2(dy, dx) * 180 / Math.PI;
      return `<div class="branch-seg" style="left:${x1}px; top:${y1}px; width:${len}px; background:${color}; transform: translateY(-50%) rotate(${deg}deg);"></div>`;
    }

    function buildIaBranchUI(stations){
      iaBranchLayout = null;

      const anchorStation = stations.find(st => st.code === IA_BRANCH_CONFIG.anchorCode)
        || stations.find(st => st.name === IA_BRANCH_CONFIG.anchorName);
      if(!anchorStation) return;

      const anchorRow = stationsEl.querySelector(`.station-row[data-stidx="${anchorStation.idx}"]`);
      if(!anchorRow) return;

      const x0 = lineWrap.clientWidth / 2;
      const y0 = anchorRow.offsetTop + (anchorRow.offsetHeight / 2);
      const points = [{ code: anchorStation.code, name: anchorStation.name, x: x0, y: y0 }];
      let branchX = x0;

      for(const st of IA_BRANCH_CONFIG.stations){
        const mirrorStation = stations.find(x => x.code === st.mirrorCode) || null;
        const mirrorRow = mirrorStation
          ? stationsEl.querySelector(`.station-row[data-stidx="${mirrorStation.idx}"]`)
          : null;
        const y = mirrorRow
          ? (mirrorRow.offsetTop + (mirrorRow.offsetHeight / 2))
          : (y0 + (st.dy || 0));

        points.push({
          code: st.code,
          name: st.name,
          x: x0 + st.dx,
          y,
        });
        branchX = Math.max(branchX, x0 + st.dx);
      }

      const html = [];
      const uiHtml = [];
      const endY = Math.max(...points.slice(1).map(p => p.y));
      if(points.length > 1){
        html.push(buildBranchSegmentHtml(x0, y0, branchX, y0, IA_LINE_COLOR));
        html.push(buildBranchSegmentHtml(branchX, y0, branchX, endY, IA_LINE_COLOR));
      }
      for(let i=1;i<points.length;i++){
        const p = points[i];
        html.push(`<div class="branch-node" style="left:${p.x}px; top:${p.y}px;"></div>`);
        uiHtml.push(`
          <div class="branch-station-ui" style="top:${p.y}px;">
            <button class="st-namebtn" type="button" data-role="branchStationName" data-stcode="${escapeHtml(p.code)}" data-stname="${escapeHtml(p.name)}" style="width:auto; max-width:150px; text-align:right;">
              <span class="txt">
                <span class="code">${escapeHtml(p.code)}</span>
                <span class="name">${escapeHtml(p.name)}</span>
              </span>
            </button>
            <button class="depbtn branch-depbtn" type="button" data-role="branchDepBtn" data-stcode="${escapeHtml(p.code)}" data-stname="${escapeHtml(p.name)}" title="発車標">
              <span class="screen" aria-hidden="true"></span>
            </button>
          </div>
        `);
      }

      let layer = lineWrap.querySelector(".branch-layer");
      if(!layer){
        layer = document.createElement("div");
        layer.className = "branch-layer";
        lineWrap.appendChild(layer);
      }
      layer.innerHTML = html.join("");

      let uiLayer = lineWrap.querySelector(".branch-ui-layer");
      if(!uiLayer){
        uiLayer = document.createElement("div");
        uiLayer.className = "branch-ui-layer";
        lineWrap.appendChild(uiLayer);
      }
      uiLayer.innerHTML = uiHtml.join("");
      uiLayer.querySelectorAll('[data-role="branchStationName"]').forEach(btn=>{
        btn.addEventListener("click", (e)=>{
          e.stopPropagation();
          openStationTimetable({
            code: String(btn.dataset.stcode ?? ""),
            name: String(btn.dataset.stname ?? ""),
          });
        });
      });
      uiLayer.querySelectorAll('[data-role="branchDepBtn"]').forEach(btn=>{
        btn.addEventListener("click", (e)=>{
          e.stopPropagation();
          openDepartureBoard({
            code: String(btn.dataset.stcode ?? ""),
            name: String(btn.dataset.stname ?? ""),
          });
        });
      });

      iaBranchLayout = {
        anchorIdx: anchorStation.idx,
        branchX,
        pointsByCode: new Map(points.map(p => [p.code, p])),
        pointsByName: new Map(points.map(p => [p.name, p])),
      };
    }

    function getIaBranchPoint(stop){
      if(!iaBranchLayout || !stop) return null;
      return iaBranchLayout.pointsByCode.get(stop.code) || iaBranchLayout.pointsByName.get(stop.stationName) || null;
    }

    function getIaBranchTerminalPoint(ref){
      if(!iaBranchLayout || !ref) return null;
      const code = String(ref.code ?? "").trim();
      const name = String(ref.name ?? ref.stationName ?? "").trim();
      if(code && code !== IA_BRANCH_CONFIG.anchorCode){
        const byCode = iaBranchLayout.pointsByCode.get(code);
        if(byCode) return byCode;
      }
      if(name && name !== IA_BRANCH_CONFIG.anchorName){
        const byName = iaBranchLayout.pointsByName.get(name);
        if(byName) return byName;
      }
      return null;
    }

    function isIABranchStop(stop){
      return !!getIaBranchPoint(stop);
    }

    function isActualIABranchStop(stop){
      if(!stop) return false;
      const code = String(stop.code ?? "").trim();
      const name = String(stop.stationName ?? "").trim();
      if(code === IA_BRANCH_CONFIG.anchorCode || name === IA_BRANCH_CONFIG.anchorName) return false;
      return !!getIaBranchPoint(stop);
    }

    function getStopLineColor(stop){
      if(!stop) return LINE_COLOR;
      if(isActualIABranchStop(stop)) return IA_LINE_COLOR;

      const code = String(stop.code ?? "").trim();
      for(const item of EXTRA_LINE_COLORS){
        if(item.prefix && code.startsWith(item.prefix)) return item.color;
      }
      return LINE_COLOR;
    }

    function interpolateIaBranchPath(pointA, pointB, frac){
      if(!pointA || !pointB || !iaBranchLayout) return null;
      const x0 = iaBranchLayout.branchX;
      const anchorY = iaBranchLayout.pointsByCode.get(IA_BRANCH_CONFIG.anchorCode)?.y ?? pointA.y;

      const aIsAnchor = pointA.code === IA_BRANCH_CONFIG.anchorCode;
      const bIsAnchor = pointB.code === IA_BRANCH_CONFIG.anchorCode;

      if(aIsAnchor && !bIsAnchor){
        return {
          x: x0,
          y: anchorY + (pointB.y - anchorY) * frac,
        };
      }

      if(!aIsAnchor && bIsAnchor){
        const rev = interpolateIaBranchPath(pointB, pointA, 1 - frac);
        return rev ? { x: rev.x, y: rev.y } : null;
      }

      return {
        x: x0,
        y: pointA.y + (pointB.y - pointA.y) * frac,
      };
    }

    function calcIABranchPosition(train, nowAbs){
      if(!iaBranchLayout) return null;
      const displayStops = train.displayStops || [];
      const branchStops = displayStops.filter(s => getIaBranchPoint(s));
      const hasActualBranchStops = displayStops.some(isActualIABranchStop);
      const anchorPoint = iaBranchLayout.pointsByCode.get(IA_BRANCH_CONFIG.anchorCode)
        || iaBranchLayout.pointsByName.get(IA_BRANCH_CONFIG.anchorName)
        || null;
      const branchOriginPoint = getIaBranchTerminalPoint({ name: train.origin });
      const branchDestPoint = getIaBranchTerminalPoint({ name: train.dest });

      if(!hasActualBranchStops && anchorPoint){
        if(branchOriginPoint && train.firstAbs != null){
          const synthStartAbs = (train.serviceStartAbs != null)
            ? train.serviceStartAbs
            : Math.max(0, train.firstAbs - IA_BRANCH_FALLBACK_TRAVEL_SEC);
          if(nowAbs >= synthStartAbs && nowAbs < train.firstAbs){
            const span = Math.max(1, train.firstAbs - synthStartAbs);
            const frac = Math.max(0, Math.min(1, (nowAbs - synthStartAbs) / span));
            const pos = interpolateIaBranchPath(branchOriginPoint, anchorPoint, frac);
            if(pos){
              return {
                x: pos.x,
                y: pos.y,
                stopped: frac <= 0.0001,
                atStationIdx: frac <= 0.0001 ? (branchOriginPoint.code ?? null) : null,
              };
            }
          }
        }

        if(branchDestPoint && train.lastAbs != null){
          const synthEndAbs = (train.serviceEndAbs != null)
            ? train.serviceEndAbs
            : (train.lastAbs + IA_BRANCH_FALLBACK_TRAVEL_SEC);
          if(nowAbs >= train.lastAbs && nowAbs <= synthEndAbs){
            const span = Math.max(1, synthEndAbs - train.lastAbs);
            const frac = Math.max(0, Math.min(1, (nowAbs - train.lastAbs) / span));
            const pos = interpolateIaBranchPath(anchorPoint, branchDestPoint, frac);
            if(pos){
              return {
                x: pos.x,
                y: pos.y,
                stopped: frac >= 0.9999,
                atStationIdx: frac >= 0.9999 ? (branchDestPoint.code ?? null) : null,
              };
            }
          }
        }

        return null;
      }

      for(const s of branchStops){
        const point = getIaBranchPoint(s);
        if(!point) continue;

        if(s.arrAbs != null && s.depAbs != null && nowAbs >= s.arrAbs && nowAbs < s.depAbs){
          return { x: point.x, y: point.y, stopped: true, atStationIdx: s.stationIdx ?? point.code };
        }
        if(s.arrAbs == null && s.depAbs != null){
          const stopStart = s.depAbs - 20;
          if(nowAbs >= stopStart && nowAbs <= s.depAbs){
            return { x: point.x, y: point.y, stopped: true, atStationIdx: s.stationIdx ?? point.code };
          }
        }
      }

      if(train.serviceStartAbs != null && train.firstAbs != null && nowAbs >= train.serviceStartAbs && nowAbs < train.firstAbs){
        const firstDisplay = displayStops[0];
        const point = getIaBranchPoint(firstDisplay);
        if(point) return { x: point.x, y: point.y, stopped: true, atStationIdx: firstDisplay.stationIdx ?? point.code };
      }
      if(train.serviceEndAbs != null && train.lastAbs != null && nowAbs > train.lastAbs && nowAbs <= train.serviceEndAbs){
        const lastDisplay = displayStops[displayStops.length - 1];
        const point = getIaBranchPoint(lastDisplay);
        if(point) return { x: point.x, y: point.y, stopped: true, atStationIdx: lastDisplay.stationIdx ?? point.code };
      }

      for(let i=0;i<displayStops.length-1;i++){
        const a = displayStops[i];
        const b = displayStops[i+1];
        const pa = getIaBranchPoint(a);
        const pb = getIaBranchPoint(b);
        if(!pa || !pb) continue;

        const t0 = (a.depAbs ?? a.arrAbs ?? a.passAbs);
        const t1 = (b.arrAbs ?? b.depAbs ?? b.passAbs);
        if(t0 == null || t1 == null || t1 <= t0) continue;
        if(nowAbs < t0 || nowAbs >= t1) continue;

        const frac = (nowAbs - t0) / (t1 - t0);
        const pos = interpolateIaBranchPath(pa, pb, frac);
        if(!pos) return null;
        return {
          x: pos.x,
          y: pos.y,
          stopped: false,
          atStationIdx: null,
        };
      }

      return null;
    }

    function buildModalStopYList(){
      const wrap = modalBody.querySelector(".train-tt-wrap");
      if(!wrap) return null;
      const table = wrap.querySelector("table");
      if(!table) return null;

      const wrapRect = wrap.getBoundingClientRect();
      const list = [];
      let railX = null;

      const posCell = wrap.querySelector("thead .tt-poscol, tbody .tt-poscol");
      if(posCell){
        const cellRect = posCell.getBoundingClientRect();
        railX = (cellRect.left - wrapRect.left) + (cellRect.width / 2);
      }

      wrap.querySelectorAll('tbody tr[data-order]').forEach(tr=>{
        const idx = Number(tr.dataset.order);
        if(!Number.isFinite(idx)) return;
        const r = tr.getBoundingClientRect();
        const centerY = (r.top - wrapRect.top) + (r.height/2);
        list.push({ idx, y: centerY });
      });

      list.sort((a,b)=>a.idx-b.idx);
      return { wrap, list, railX };
    }

    function getModalVisibleStops(train){
      const baseStops = (train.displayStops?.length ? train.displayStops : train.stops) || [];
      return baseStops.filter(s => {
        const isPassOnly = (s.passAbs != null && s.arrAbs == null && s.depAbs == null);
        return !(isPassOnly && showPassStopsMode === "hide");
      });
    }

    function getModalTimelineStops(train){
      const visibleStops = getModalVisibleStops(train);
      const out = [...visibleStops];
      const last = out[out.length - 1] || null;
      const destName = String(train?.dest ?? "").trim();

      const shouldAppendTerminal =
        !!destName &&
        !Number.isFinite(train?.serviceEndStationIdx) &&
        train?.serviceEndAbs != null &&
        train?.lastAbs != null &&
        train.serviceEndAbs > train.lastAbs &&
        (!last || String(last.stationName ?? "").trim() !== destName);

      if(shouldAppendTerminal){
        out.push({
          stationIdx: null,
          stationName: destName,
          code: "",
          track: "",
          arrSec: null,
          depSec: null,
          passSec: null,
          arrAbs: train.serviceEndAbs,
          depAbs: null,
          passAbs: null,
          syntheticTerminal: true,
        });
      }

      return out;
    }

    function calcTrainModalDisplayPosition(train, nowAbs){
      const visibleStops = getModalTimelineStops(train);
      if(!visibleStops.length) return { status:"not_in_service", rowPos:null };

      for(let i=0;i<visibleStops.length;i++){
        const s = visibleStops[i];
        if(s.arrAbs != null && s.depAbs != null){
          if(nowAbs >= s.arrAbs && nowAbs < s.depAbs){
            return { status:"stopped", rowPos:i, stopOrder:i };
          }
        }
        if(s.arrAbs != null && s.depAbs == null && nowAbs >= s.arrAbs){
          if(s.syntheticTerminal){
            const terminalLimit = train.serviceEndAbs ?? s.arrAbs;
            if(nowAbs > terminalLimit){
              continue;
            }
          }
          return { status:"stopped", rowPos:i, stopOrder:i };
        }
        if(s.arrAbs == null && s.depAbs != null){
          const stopStart = s.depAbs - 20;
          if(nowAbs >= stopStart && nowAbs <= s.depAbs){
            return { status:"stopped", rowPos:i, stopOrder:i };
          }
        }
      }

      if(train.serviceStartAbs != null && train.firstAbs != null && nowAbs >= train.serviceStartAbs && nowAbs < train.firstAbs){
        return { status:"stopped", rowPos:0, stopOrder:0 };
      }
      if(train.serviceEndAbs != null && train.lastAbs != null && nowAbs > train.lastAbs && nowAbs <= train.serviceEndAbs){
        if(!Number.isFinite(train.serviceEndStationIdx)){
          // Synthetic terminal row handles the interpolation / arrival in this case.
        }else{
          const lastOrder = visibleStops.length - 1;
          return { status:"stopped", rowPos:lastOrder, stopOrder:lastOrder };
        }
      }

      for(let i=0;i<visibleStops.length-1;i++){
        const a = visibleStops[i];
        const b = visibleStops[i+1];
        const t0 = (a.depAbs ?? a.arrAbs ?? a.passAbs);
        const t1 = (b.arrAbs ?? b.depAbs ?? b.passAbs);
        if(t0 == null || t1 == null || t1 <= t0) continue;
        if(nowAbs >= t0 && nowAbs < t1){
          const frac = (nowAbs - t0) / (t1 - t0);
          return { status:"running", rowPos: i + frac };
        }
      }

      if(train.lastAbs != null && nowAbs > train.lastAbs && !Number.isFinite(train.serviceEndStationIdx)){
        return { status:"not_in_service", rowPos:null };
      }

      return { status:"not_in_service", rowPos:null };
    }

    function buildTrainModalRailGradient(train, yList, railTop, railHeight){
      const visibleStops = getModalTimelineStops(train);
      if(!visibleStops.length || !yList?.length || railHeight <= 0) return LINE_COLOR;

      const clamp01 = (v) => Math.max(0, Math.min(1, v));
      const pct = (y) => `${(clamp01((y - railTop) / railHeight) * 100).toFixed(2)}%`;
      if(visibleStops.length === 1){
        return getStopLineColor(visibleStops[0]);
      }

      const anchorIndex = visibleStops.findIndex(s => String(s.code ?? "").trim() === IA_BRANCH_CONFIG.anchorCode || String(s.stationName ?? "").trim() === IA_BRANCH_CONFIG.anchorName);
      const branchIndexes = visibleStops
        .map((s, i) => isActualIABranchStop(s) ? i : -1)
        .filter(i => i >= 0);
      const hasBranchAbove = anchorIndex >= 0 && branchIndexes.some(i => i < anchorIndex);
      const hasBranchBelow = anchorIndex >= 0 && branchIndexes.some(i => i > anchorIndex);

      const colorStops = [];
      const pushBand = (color, startY, endY) => {
        if(endY <= startY) return;
        colorStops.push(`${color} ${pct(startY)}`);
        colorStops.push(`${color} ${pct(endY)}`);
      };

      pushBand(getStopLineColor(visibleStops[0]), railTop, yList[0].y);

      for(let i=0;i<visibleStops.length-1;i++){
        const startY = yList[i]?.y;
        const endY = yList[i+1]?.y;
        if(startY == null || endY == null) continue;

        let color = getStopLineColor(visibleStops[i]);
        if(i === anchorIndex && hasBranchBelow && !hasBranchAbove){
          color = IA_LINE_COLOR;
        }
        pushBand(color, startY, endY);
      }

      pushBand(getStopLineColor(visibleStops[visibleStops.length - 1]), yList[visibleStops.length - 1].y, railTop + railHeight);

      return colorStops.length ? `linear-gradient(to bottom, ${colorStops.join(", ")})` : LINE_COLOR;
    }

    function interpolateYFromIdxFloat(idxFloat, yList){
      if(!yList?.length) return null;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      const minIdx = yList[0].idx;
      const maxIdx = yList[yList.length-1].idx;
      const x = clamp(idxFloat, minIdx, maxIdx);

      const rounded = Math.round(x);
      const exact = yList.find(p => p.idx === rounded && Math.abs(x-rounded) < 1e-6);
      if(exact) return exact.y;

      let left = null;
      let right = null;

      for(let i=0;i<yList.length;i++){
        const p = yList[i];
        if(p.idx <= x) left = p;
        if(p.idx >= x){ right = p; break; }
      }
      if(!left) left = yList[0];
      if(!right) right = yList[yList.length-1];

      if(left.idx === right.idx) return left.y;

      const frac = (x - left.idx) / (right.idx - left.idx);
      return left.y + (right.y - left.y) * frac;
    }

    function updateTrainModalRailPosition(){
      if(!modal.classList.contains("show")) return;
      if(!openedTrainId) return;

      const train = findTrainById(openedTrainId);
      if(!train) return;

      const disp = getDisplayDate();
      const baseSec = disp.getHours()*3600 + disp.getMinutes()*60 + disp.getSeconds();
      const nowAbs = (CUTOVER_SEC > 0 && baseSec <= CUTOVER_SEC) ? baseSec + 86400 : baseSec;

      const p = calcTrainModalDisplayPosition(train, nowAbs);
      const wrapInfo = buildModalStopYList();
      if(!wrapInfo) return;

      const wrap = wrapInfo.wrap;
      const yList = wrapInfo.list;
      const railX = wrapInfo.railX;

      const rail = wrap.querySelector('[data-role="ttRail"]');
      const icon = wrap.querySelector('[data-role="ttIcon"]');
      const dot  = wrap.querySelector('[data-role="ttDot"]');
      if(!rail || !icon || !dot) return;
      if(railX != null){
        rail.style.left = `${railX}px`;
        icon.style.left = `${railX}px`;
        dot.style.left = `${railX}px`;
      }

      const tbody = wrap.querySelector("tbody");
      if(tbody){
        const wRect = wrap.getBoundingClientRect();
        const bRect = tbody.getBoundingClientRect();
        const top = (bRect.top - wRect.top) + 6;
        const bottom = (wRect.bottom - bRect.bottom) + 6;
        rail.style.top = `${Math.max(10, top)}px`;
        rail.style.bottom = `${Math.max(10, bottom)}px`;
        const railTop = Math.max(10, top);
        const railBottom = Math.max(10, bottom);
        const railHeight = Math.max(1, wrap.clientHeight - railTop - railBottom);
        rail.style.background = buildTrainModalRailGradient(train, yList, railTop, railHeight);
      }

      const tColor = typeColor(train.type);
      icon.style.setProperty("--c", tColor);

      if(p.status === "not_in_service" || p.rowPos == null){
        icon.classList.remove("show");
        dot.classList.remove("show");
        return;
      }

      const y = interpolateYFromIdxFloat(p.rowPos, yList);
      if(y == null){
        icon.classList.remove("show");
        dot.classList.remove("show");
        return;
      }

      if(p.status === "stopped" && Number.isFinite(p.stopOrder)){
        const yStop = interpolateYFromIdxFloat(p.stopOrder, yList) ?? y;
        dot.style.top = `${yStop}px`;
        dot.classList.add("show");
      }else{
        dot.classList.remove("show");
      }

      icon.style.top = `${y}px`;
      icon.classList.add("show");
    }

    function getCurrentFocusStationIdxForTrain(train){
      if(!train) return null;

      const disp = getDisplayDate();
      const baseSec = disp.getHours()*3600 + disp.getMinutes()*60 + disp.getSeconds();
      const nowAbs = (CUTOVER_SEC > 0 && baseSec <= CUTOVER_SEC) ? baseSec + 86400 : baseSec;
      const p = calcTrainPosition(train, nowAbs);

      if(p.status === "stopped" && Number.isFinite(p.atStationIdx)){
        return p.atStationIdx;
      }
      if(p.y01 != null){
        const nearestIdx = Math.round(p.y01 * (STATION_COUNT - 1));
        if(Number.isFinite(nearestIdx)) return nearestIdx;
      }

      const fallbackIdx = train.stops?.[0]?.stationIdx;
      return Number.isFinite(fallbackIdx) ? fallbackIdx : null;
    }
